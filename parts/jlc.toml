# MPN -> JLCPCB assembly data, for every part on every Micras board.
#
# lcsc               LCSC / JLCPCB part number
# type               "basic" (no feeder fee) or "extended"; `make parts-online` flags a change
# rotation           degrees added to KiCad's rotation in the CPL; check each part once in JLC's
#                    placement preview, then set rotation_verified = true
# source             where the mapping was checked
# why_extended       an extended resistor or capacitor on the main board: why no basic part does (a value
#                    or rating the datasheet fixes, a tolerance, a package); tests/test_main.py
# assembly = "hand"  the team buys and solders the part itself: `make fab` leaves it out of the JLCPCB BOM
#                    and CPL and lists it in <board>-hand-assembly.csv; hand_why says why
#
# `micras-pcb parts` fails when a board uses an MPN missing here; `--online` adds stock and type.

