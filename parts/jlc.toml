# MPN -> JLCPCB assembly data, for every part on every Micras board.
#
# lcsc               LCSC / JLCPCB part number
# type               "basic" (no feeder fee) or "extended"; the weekly stock check flags a change
# rotation           degrees added to KiCad's rotation in the CPL; check each part once in JLC's
#                    placement preview, then set rotation_verified = true
# source             where the mapping was checked
#
# `micras-pcb parts` fails when a board uses an MPN missing here; `--online` adds stock and type.

[parts."AS5047U-HTSM"]
lcsc = "C2153630"
type = "extended"
rotation = 0
rotation_verified = false
source = "jlcpcb.com parts search 2026-10-13: extended, 288 in stock; previous board's datasheet set (hw_debug/datasheets/C2153630)"

[parts."CC0603KRX7R9BB104"]
lcsc = "C14663"
