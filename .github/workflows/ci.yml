name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install KiCad (versions.env pins the patch release)
        run: ./ci/install-kicad.sh

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true

      - name: Install the Zener toolchain
        run: ./ci/setup.sh

      - name: Python environment
        run: uv sync --locked

      - name: Generated files are up to date
        run: |
          make gen
          if ! git diff --exit-code --stat; then
            echo "::error::Generated files differ from the commit: run 'make gen' and commit the result."
            git diff | head -200
            exit 1
          fi

      - name: Checks
        run: make check

      - name: Review outputs and fab package
        if: always()
        run: make review

      - name: Upload build
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: micraspcb-${{ github.sha }}
          path: |
            build/*/review
            build/*/fab
          retention-days: 30
