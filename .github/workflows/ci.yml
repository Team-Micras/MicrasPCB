name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - name: Install KiCad (versions.env pins the patch release)
        run: |
          . ./versions.env
          sudo add-apt-repository -y ppa:kicad/kicad-10.0-releases
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends kicad
          got="$(kicad-cli version)"
          if [ "$got" != "$KICAD_VERSION" ]; then
            echo "::error::KiCad $got from the PPA, versions.env pins $KICAD_VERSION. Bump KICAD_VERSION (and regenerate) in its own PR."
            exit 1
          fi

      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true

      - name: Install the Zener toolchain
        run: ./ci/setup.sh

      - name: Python environment
        run: uv sync --locked

      - name: Generated files are up to date
        run: |
          make gen
          if ! git diff --exit-code --stat; then
            echo "::error::Generated files differ from the commit: run 'make gen' and commit the result."
            git diff | head -200
            exit 1
          fi

      - name: Checks
        run: make check

      - name: Review outputs and fab package
        if: always()
        run: make site

      - name: Upload build
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: micraspcb-${{ github.sha }}
          path: |
            build/site
            build/*/fab
          retention-days: 30
