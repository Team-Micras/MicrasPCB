name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install KiCad (versions.env pins the patch release)
        run: |
          . ./versions.env
          sudo add-apt-repository -y ppa:kicad/kicad-10.0-releases
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends kicad
          got="$(kicad-cli version)"
          if [ "$got" != "$KICAD_VERSION" ]; then
            echo "::error::KiCad $got from the PPA, versions.env pins $KICAD_VERSION. Bump KICAD_VERSION (and regenerate) in its own PR."
            exit 1
          fi

      - name: Install uv and the Zener toolchain
        run: ./ci/setup.sh

      - name: Python environment
        run: uv sync --frozen

      - name: Generated files are up to date
        run: |
          make gen
          if ! git diff --exit-code --stat; then
            echo "::error::Generated files differ from the commit: run 'make gen' and commit the result."
            git diff | head -200
            exit 1
          fi

      - name: Checks
        run: make check

      - name: Review outputs, fab package and portal
        if: always()
        run: make site

      - name: Upload build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: micraspcb-${{ github.sha }}
          path: |
            build/site
            build/*/fab
          retention-days: 30

      - name: Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/site

  pages:
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
