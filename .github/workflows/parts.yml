name: JLCPCB parts

# Weekly: every part still in stock at JLCPCB with the library type parts/jlc.toml expects.
on:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

jobs:
  stock:
    runs-on: ubuntu-24.04
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@v4
      - name: Install uv and the Zener toolchain
        run: ./ci/setup.sh
      - name: Check stock
        id: stock
        run: |
          set -o pipefail
          uv run micras-pcb parts --online | tee parts.txt
      - name: Open an issue
        if: failure() && steps.stock.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --title "JLCPCB parts check failed ($(date -u +%F))" \
            --body "$(printf 'The weekly stock check found a problem:\n\n```\n%s\n```\n' "$(cat parts.txt)")"
