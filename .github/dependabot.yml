# Weekly PRs for new GitHub Actions and Python dev-tool releases. KiCad and Zener are pinned in
# versions.env and bumped by hand, since a bump can change the generated files.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "⬆️"
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "⬆️"
