# Main board: mechanical single source of truth.
#
# The spec owns this board's whole Edge.Cuts outline (`micras-pcb mech main` draws it), the
# aux/grid origin, and the footprints it places (screw holes, battery switch, ESP32 module, wall
# sensors: written locked). It also holds the zones the drive blocks of MicrasHardware take
# on the board, which the layout tests check. `micras-pcb mech main` exports
# build/main/main_mech.json for MicrasHardware, micras-simulation and the firmware.
#
# Frame: the robot frame (MicrasHardware, the firmware). Origin at the wheel-axle
# midpoint on the board's bottom surface; x forward, y left, z up; millimetres. On the KiCad sheet:
# x_kicad = origin_x - y, y_kicad = origin_y - x.
#
# The middle of the board (wheel notches, encoder slots, screw holes, fan hole) is the v1 main
# board's, so the wheels, drive blocks and fan mount of MicrasHardware fit both boards; the nose and
# the rear are as short as the wall sensors and the ESP32 module allow, and MicrasHardware's parts
# that follow the outline (the sensor caps, the skirt, the skids) follow this one. "v1 board" in the
# sources below is MicrasPCB e34fb9a (its boards/main and spec/main.toml). The owner's brief
# (2026-10-17): at most 100 x 50 mm, rounded corners, a fan hole, wheel cut-outs, a switch cut-out,
# room for the drive blocks, four screw holes, no USB cut-out (no Bluetooth module), and no parts on
# the bottom; then (2026-11-03) as short as the mechanics allow, and a ring around the fan hole where
# parts stay low ([fan_ring]).
#
# Every value is {value, source}, as in micras-simulation's robot.toml.

[pcb]
thickness = { value = 1.0412, source = "boards/main/main.zen Board() stackup: the v1 board's 4-layer 1.0 mm JLCPCB stackup" }
copper_layers = { value = 4, source = "boards/main/main.zen Board(layers = 4)" }
via_in_pad = { value = "open", source = "the owner (2026-10-25): no via-in-pad process (JLCPCB PCB Capabilities, accessed 2026-10-25: its Via-in-Pad Process fills vias with epoxy or copper paste and plates them over, the default only from 6 layers). The exposed pads' thermal vias are 0.2 mm holes (TI SLVSF66A land pattern 4223595/B; a smaller via loses less solder, TI SLUA271C 3.4.1) left open on both sides (tenting a pad's via from the back traps air, SLUA271C 3.4.1), and the pads' paste is split into windows clear of them (the footprints; 50-70 % coverage, SLUA271C 4.4)" }
via_drill = { value = 0.2, source = "the board's smallest via, a 0.2 mm hole in 0.45 mm copper, for the escapes of the STM32's 0.4 mm pitch pins (boards/main/main.zen ViaDimension(diameter = 0.45, drill = 0.2)); tests/test_fab.py holds it to the layout. JLCPCB charges extra for a 0.2 or 0.25 mm hole with copper under 0.45 mm (PCB Capabilities, Drilling, accessed 2026-11-07), so every via on the board has 0.45 mm copper or a 0.3 mm hole (tests/test_main_layout.py test_vias_take_jlcpcbs_standard_option) and the board is ordered, and quoted (micras-pcb quote), with the standard via option 0.3mm/(0.4/0.45mm)" }
via_diameter = { value = 0.45, source = "the copper of the smallest via (via_drill)" }
assembly = { value = "economic", source = "JLCPCB Economic PCBA, 2 of 5 boards assembled (commit 22028f8); the board is above its 10 x 10 mm single-board minimum (jlcpcb.com/capabilities/pcb-assembly-capabilities, accessed 2026-11-07)" }

