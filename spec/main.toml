# A 91.15 x 50 mm board: the v1 board's middle, a nose that holds the MCU centred at the front and the
# wall sensors in the smallest turning circle, and a rear that fills the same circle.
front = { value = 47.6, source = "the owner (2026-11-03): the smallest turning circle (the farthest outline point from the axle), with IC1 centred at the front, partly over the fan ring ([ic1]), the diagonal wall sensors ahead of it and the frontal ones beside it, every wall rule held (lens 1.0 mm inside the outline, 0.5 mm from the view corridors and between the boards with their lenses, joints off the fan ring), and the parts ahead of the fan hole's centre at about the committed board's density. The search over the front, the nose's shape, the wall sensors and IC1 (reports/scratch/shorten/r_de.py and fast.py: the rules of tests/test_wall_joint.py and tests/test_spec.py, each kept with 0.2 mm or more to spare for the outline's tolerance) finds the smallest radius, 49.26 mm, at front 47.52 (with the v1 board's 2.5 / 5 mm nose radii), where the lenses, the view corridors, IC1's gap to the fan hole and to the diagonal joints are all at their limits; 47.6 is the rounded value. The owner then spread the frontal sensors to y +-19.8 and asked for a pointier nose (2026-11-03): nose_half_width and nose_shoulder_x; with the 4 mm nose radii (front_corner_radius, shoulder_radius) R is 49.46 mm. The density: those parts (74 courtyards, 482 mm2 on the layout of 2026-11-03, W1-W4 aside) over the board ahead of x 17.5 outside the wall joints plus the ring's front half (198 mm2, parts up to 1.0 mm), 39.1 %, against 34.5 % on the committed board's outline. Longer fronts cost radius: 48.5, 49.54 mm (38.0 %); 50.0, 50.44 mm (36.5 %); 51.5, 51.52 mm (35.4 %). IC1 kept off the ring (x 36.81) would need 53.59 mm, and square (x 35.88) 55.35 mm" }
rear = { value = -43.55, source = "the owner (2026-11-03): the robot fills one turning circle, U13's antenna counted: the antenna's outer corner ([u13] x - 13.6, [u13] y - 7.7 = (rear + 0.5, -24.3)) reaches the nose's radius (49.46 mm with the 4 mm nose radii) at rear -43.58; -43.55 puts it at 49.43 mm, and the rest of the rear edge (the notches' corners, the edge between them) lies inside. U13 (2.4 mm high, ESP32-C5-MINI-1 datasheet v1.4 Table 1-1) also needs the rear at -41.3 or further back: its courtyard reaches 22.1 mm in from the rear edge and it cannot stand under block_R's rear screw boss (2.6 mm over the board down to x -18.9, MicrasHardware 6b48d17; zone rear_boss_a_right to x -19.2); at -43.55 it ends 2.25 mm behind that zone" }
width = { value = 50.0, source = "the owner's maximum width (2026-10-17); v1 board spec/main.toml [outline] width" }
nose_half_width = { value = 9.1, source = "the owner (2026-11-03): a nose as triangular as the rules allow, the turning radius no larger (49.34 mm) and the front at 47.6. The narrowest front flat found (reports/scratch/shorten/tri.py: the rules of tests/test_wall_joint.py and tests/test_spec.py, each kept with 0.2 mm or more to spare for the outline's tolerance) is 9.0 mm a side, where W2/W3's lenses reach the chamfers (1.2 mm inside), W1/W4 stand 0.7 mm out of W2/W3's view corridors, IC1's courtyard is 2.7 mm from W2/W3's and the shoulders reach the 49.34 mm circle; 9.1 rounds it with every rule held. The front row of LEDs (D1, D2, D4/R4, D5/R5, 5.9 mm behind their committed places) spans y -6.5 to 6.8 and keeps 0.175 mm inside the front edge, as on the committed board" }
nose_shoulder_x = { value = 43.4, source = "the chamfer meets the side y = +-25 at x 43.4, from (47.6, 9.1): see nose_half_width; the shoulders' 4 mm arcs reach 49.46 mm from the axle, the nose's turning radius" }
