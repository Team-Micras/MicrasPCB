# Main board: mechanical single source of truth for its interface to the robot.
#
# The Edge.Cuts outline itself is layout geometry (boards/main/layout/main.kicad_pcb, from the
# Altium MicrasMainBoard.PcbDoc). This file holds the numbers other parts mate with, and
# `micras-pcb mech main`:
#   - writes the aux/grid origin and the screw holes H1-H4 (locked footprints) into the layout,
#   - checks that the outline has every feature below where this file says (fails on drift),
#   - exports build/main/main_mech.json for MicrasHardware, micras-simulation and the firmware.
#
# Frame: the robot frame of MicrasHardware and the firmware. Origin at the wheel-axle midpoint
# (midway between the two encoder slot centres) on the board's bottom surface; x forward, y left,
# z up; millimetres. On the KiCad sheet: x_kicad = origin_x - y, y_kicad = origin_y - x.
#
# Every value is {value, source}, as in micras-simulation's robot.toml.

[pcb]
thickness = { value = 1.0412, source = "Altium MicrasMainBoard.PcbDoc layer stack, finished thickness (boards/main/previous/board.json board.thickness); MicrasHardware micras/params.py Board.thickness" }
copper_layers = { value = 4, source = "Altium MicrasMainBoard.PcbDoc layer stack" }

[kicad]
origin_x = { value = 148.5011, source = "MicrasHardware tools/export_board.py AXLE_KX: midway between the encoder slot centres of the Altium MicrasMainBoard.PcbDoc Edge.Cuts" }
origin_y = { value = 113.5036, source = "MicrasHardware tools/export_board.py AXLE_KY: the encoder slot centre line of the Altium MicrasMainBoard.PcbDoc Edge.Cuts" }
aux_origin_x = { value = 84.340305, source = "Altium MicrasMainBoard.PcbDoc origin (boards/main/previous/board.json board.aux_axis_origin): drill and placement origin of the fab outputs" }
aux_origin_y = { value = 180.6148, source = "Altium MicrasMainBoard.PcbDoc origin (boards/main/previous/board.json board.aux_axis_origin)" }

[outline]
front = { value = 53.5, source = "Altium MicrasMainBoard.PcbDoc Edge.Cuts extents (board.json edge_cuts_bbox, KiCad y = 60.0036)" }
rear = { value = -36.5, source = "Altium MicrasMainBoard.PcbDoc Edge.Cuts extents (board.json edge_cuts_bbox, KiCad y = 150.0036)" }
width = { value = 50.0, source = "Altium MicrasMainBoard.PcbDoc Edge.Cuts extents (board.json edge_cuts_bbox, KiCad x = 123.5011 to 173.5011)" }

[holes]
diameter = { value = 2.4, source = "Altium MicrasMainBoard.PcbDoc screw holes: 2.4 mm NPTH (board.json unnamed); MicrasHardware Board.hole_d" }

[h1]
x = { value = 2.5, source = "Altium MicrasMainBoard.PcbDoc unnamed footprint NONAME1 (board.json); MicrasHardware Board.front_hole" }
y = { value = 11.75, source = "Altium MicrasMainBoard.PcbDoc unnamed footprint NONAME1 (board.json); MicrasHardware Board.front_hole" }
rotation = { value = 0, source = "round hole" }
path = { value = "H1.MH", source = "boards/main/main.zen instance path" }

[h2]
x = { value = 2.5, source = "Altium MicrasMainBoard.PcbDoc unnamed footprint NONAME2 (board.json); MicrasHardware Board.front_hole" }
y = { value = -11.75, source = "Altium MicrasMainBoard.PcbDoc unnamed footprint NONAME2 (board.json); MicrasHardware Board.front_hole" }
rotation = { value = 0, source = "round hole" }
path = { value = "H2.MH", source = "boards/main/main.zen instance path" }

[h3]
x = { value = -15.5, source = "Altium MicrasMainBoard.PcbDoc unnamed footprint NONAME3 (board.json); MicrasHardware Board.rear_hole" }
y = { value = 19.25, source = "Altium MicrasMainBoard.PcbDoc unnamed footprint NONAME3 (board.json); MicrasHardware Board.rear_hole" }
rotation = { value = 0, source = "round hole" }
path = { value = "H3.MH", source = "boards/main/main.zen instance path" }

[h4]
x = { value = -15.5, source = "Altium MicrasMainBoard.PcbDoc unnamed footprint NONAME4 (board.json); MicrasHardware Board.rear_hole" }
y = { value = -19.25, source = "Altium MicrasMainBoard.PcbDoc unnamed footprint NONAME4 (board.json); MicrasHardware Board.rear_hole" }
rotation = { value = 0, source = "round hole" }
path = { value = "H4.MH", source = "boards/main/main.zen instance path" }

[encoder_slots]
# One slot per wheel, long along x, centred on the axle line; the EncoderSlot footprint
# (components/micras/EncoderSlot) of each sits on its centre. The encoder board's tab
# (spec/encoder.toml [tab], [pcb]) stands in it.
y = { value = 6.9, source = "Altium MicrasMainBoard.PcbDoc Edge.Cuts slot rectangles (KiCad x = 155.0011 to 155.9011 and 141.1011 to 142.0011); MicrasHardware Board.encoder_slot_y" }
length = { value = 5.1, source = "Altium MicrasMainBoard.PcbDoc Edge.Cuts slot rectangles (KiCad y = 110.9536 to 116.0536)" }
width = { value = 0.9, source = "Altium MicrasMainBoard.PcbDoc Edge.Cuts slot rectangles" }
right_path = { value = "SENSORS.EC1.SLOT", source = "boards/main/Sensors.zen: EC1 takes the right wheel's encoder board (y < 0)" }
left_path = { value = "SENSORS.EC2.SLOT", source = "boards/main/Sensors.zen: EC2 takes the left wheel's encoder board (y > 0)" }

[usb_pegs]
# Holes for the two plastic positioning pegs of the USB-C receptacle U2 (GT-USB-7010ASV), drawn
# as 16-point polygons on Edge.Cuts.
x = { value = -25.4409, source = "Altium MicrasMainBoard.PcbDoc Edge.Cuts peg polygons (KiCad y = 138.9445)" }
left_y = { value = 1.15, source = "Altium MicrasMainBoard.PcbDoc Edge.Cuts peg polygon (KiCad x = 147.3511)" }
right_y = { value = -4.64, source = "Altium MicrasMainBoard.PcbDoc Edge.Cuts peg polygon (KiCad x = 153.1411)" }
diameter = { value = 0.65, source = "Altium MicrasMainBoard.PcbDoc Edge.Cuts peg polygons (0.65 mm across the flats)" }

[fan_hole]
x = { value = 17.5, source = "Altium MicrasMainBoard.PcbDoc Edge.Cuts circle (four arcs); MicrasHardware Board.fan_hole_x" }
diameter = { value = 15.0, source = "Altium MicrasMainBoard.PcbDoc Edge.Cuts circle; MicrasHardware Board.fan_hole_d" }

[wheel_notches]
# A rectangular notch for each wheel, both sides of the board, round-cornered.
inner_y = { value = 17.25, source = "Altium MicrasMainBoard.PcbDoc Edge.Cuts; MicrasHardware Board.notch_inner_y" }
half_length = { value = 8.5, source = "Altium MicrasMainBoard.PcbDoc Edge.Cuts; MicrasHardware Board.notch_x" }
corner_radius = { value = 2.0, source = "Altium MicrasMainBoard.PcbDoc Edge.Cuts notch arcs" }
