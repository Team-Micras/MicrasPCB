[drive_blocks]
# What MicrasHardware's drive blocks, motors and wheels take over the board, from its model at
# 6b48d17 (micras/drive.py, layout.py, fasteners.py). tools/chassis_shadow.py ray-casts every drive
# part from each 0.05 mm point of the board top and writes, for every 0.1 mm point that needs it, the
# lowest material within Layout.clearance (0.3 mm) less that clearance: spec/main_chassis.json. The
# zones follow it: each is [x_min, x_max, y_min, y_max, max_part_height]; a part inside a zone stays at
# or below its height (0: part-free), so every part keeps Layout.clearance from the chassis above and
# beside it. Where zones overlap the lowest holds; a higher zone may take in a lower one's cells (the
# motor ring's bands nest). tests/test_spec.py checks that the zones hold every point of the file. The
# sides differ: block_L wraps the low left motor (Layout.motor_angle_left = 180 deg) and reaches back to
# x -21.9, the right motor rides high (112 deg) and block_R ends at x -18.9 at its rear boss. Off the
# zones the chassis leaves 8.3 mm and more ([chassis] open_height). The owner may reshape the blocks
# (2026-10-17): these zones are the current blocks'.
