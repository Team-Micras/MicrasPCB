feet_right = { value = [-18.0, 8.0, -17.25, -13.5, 0.0], source = "MicrasHardware model: block_R's plate on the board, as block_L's" }
front_boss_left = { value = [-0.75, 5.75, 8.5, 13.5, 0.0], source = "MicrasHardware model: block_L's front screw boss round H1 (2.5, 11.75), 0.3 mm level from y 9.25" }
