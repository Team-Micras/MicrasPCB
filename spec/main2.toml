y = { value = -11.75, source = "spec/main.toml [h2]; MicrasHardware Board.front_hole" }
rotation = { value = 0, source = "round hole" }
path = { value = "H2.MH", source = "boards/main2/main2.zen instance path" }

[h3]
x = { value = -15.5, source = "spec/main.toml [h3]; MicrasHardware Board.rear_hole" }
y = { value = 19.25, source = "spec/main.toml [h3]; MicrasHardware Board.rear_hole" }
rotation = { value = 0, source = "round hole" }
path = { value = "H3.MH", source = "boards/main2/main2.zen instance path" }

[h4]
x = { value = -15.5, source = "spec/main.toml [h4]; MicrasHardware Board.rear_hole" }
y = { value = -19.25, source = "spec/main.toml [h4]; MicrasHardware Board.rear_hole" }
