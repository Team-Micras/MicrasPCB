path = { value = "H4.MH", source = "boards/main2/main2.zen instance path" }

[encoder_slots]
y = { value = 6.9, source = "spec/main.toml [encoder_slots] y; MicrasHardware Board.encoder_slot_y" }
length = { value = 5.8, source = "spec/main.toml [encoder_slots] length: the encoder board's 5.0 mm tab plus tolerances" }
width = { value = 1.0, source = "spec/main.toml [encoder_slots] width: JLCPCB minimum non-plated slot width" }
corner_radius = { value = 0.5, source = "spec/main.toml [encoder_slots] corner_radius: the 1.0 mm cutter" }
