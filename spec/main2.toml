# Main board, second revision: mechanical single source of truth.
#
# The spec owns this board's whole Edge.Cuts outline (`micras-pcb mech main2` draws it), the
# aux/grid origin, and the footprints it places (screw holes, battery switch, USB-C receptacle,
# ESP32 module, wall sensors: written locked). It also holds the zones the drive blocks of MicrasHardware take
# on the board, which the layout tests check. `micras-pcb mech main2` exports
# build/main2/main2_mech.json for MicrasHardware, micras-simulation and the firmware.
#
# Frame: the robot frame of spec/main.toml (MicrasHardware, the firmware). Origin at the wheel-axle
# midpoint on the board's bottom surface; x forward, y left, z up; millimetres. On the KiCad sheet:
# x_kicad = origin_x - y, y_kicad = origin_y - x.
#
# The middle of the board (wheel notches, encoder slots, screw holes, fan hole) and the nose (the
# wall sensors and their front outline) are boards/main's, so the wheels, drive blocks, fan mount
# and sensor caps of MicrasHardware fit both boards. The owner's brief (2026-10-17): at most
# 100 x 50 mm, rounded corners, a fan hole, wheel cut-outs, a switch cut-out, room for the drive
# blocks, four screw holes, no USB cut-out (the Bluetooth module is gone), no part-free ring around
# the fan hole (the fan sits higher), and no parts on the bottom.
#
# Every value is {value, source}, as in micras-simulation's robot.toml.

[pcb]
thickness = { value = 1.0412, source = "boards/main2/main2.zen Board() stackup: boards/main's 4-layer 1.0 mm JLCPCB stackup" }
copper_layers = { value = 4, source = "boards/main2/main2.zen Board(layers = 4)" }
via_in_pad = { value = "open", source = "the owner (2026-10-25): no via-in-pad process (JLCPCB PCB Capabilities, accessed 2026-10-25: its Via-in-Pad Process fills vias with epoxy or copper paste and plates them over, the default only from 6 layers). The exposed pads' thermal vias are 0.2 mm holes (TI SLVSF66A land pattern 4223595/B; a smaller via loses less solder, TI SLUA271C 3.4.1) left open on both sides (tenting a pad's via from the back traps air, SLUA271C 3.4.1), and the pads' paste is split into windows clear of them (the footprints; 50-70 % coverage, SLUA271C 4.4)" }

[kicad]
origin_x = { value = 148.5011, source = "spec/main.toml [kicad] origin_x: the same sheet position as boards/main" }
origin_y = { value = 113.5036, source = "spec/main.toml [kicad] origin_y: the same sheet position as boards/main" }
aux_origin_x = { value = 148.5011, source = "the rear edge centre, as boards/main's drill and placement origin" }
aux_origin_y = { value = 160.0036, source = "the rear edge centre: origin_y - [outline] rear" }

[outline]
# A 100 x 50 mm board: boards/main's nose and middle, its rear 10 mm longer and square.
front = { value = 53.5, source = "spec/main.toml [outline] front: the nose of boards/main" }
rear = { value = -46.5, source = "front - 100 mm, the owner's maximum length (2026-10-17); the rear corners turn inside the nose's 55.2 mm in-place envelope (research/next-revision/README.md, ESP placement)" }
width = { value = 50.0, source = "the owner's maximum width (2026-10-17); spec/main.toml [outline] width" }
nose_half_width = { value = 15.0, source = "boards/main Edge.Cuts: the front edge and the nose chamfers meet at y = +-15.0 (their lines through (53.5, 13.455)-(52.118, 15.691) and (34.556, 24.472))" }
nose_shoulder_x = { value = 33.5, source = "boards/main Edge.Cuts: the nose chamfer meets the side y = +-25 at x = 33.5 (slope 1/2)" }
front_corner_radius = { value = 2.5, source = "boards/main Edge.Cuts: R2.5 arcs centred at (51.0, +-13.455)" }
shoulder_radius = { value = 5.0, source = "boards/main Edge.Cuts: R5 arcs centred at (32.32, +-20.0)" }

[holes]
# M2 screws of the drive blocks, as on boards/main.
diameter = { value = 2.4, source = "spec/main.toml [holes] diameter; MicrasHardware Board.hole_d" }

[h1]
x = { value = 2.5, source = "spec/main.toml [h1]; MicrasHardware Board.front_hole" }
y = { value = 11.75, source = "spec/main.toml [h1]; MicrasHardware Board.front_hole" }
rotation = { value = 0, source = "round hole" }
path = { value = "H1.MH", source = "boards/main2/main2.zen instance path" }

[h2]
