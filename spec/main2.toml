rear_boss_left = { value = [-18.0, -12.75, 13.5, 25.0, 0.0], source = "MicrasHardware model: block_L's rear screw boss round H3 (-15.5, 19.25), 0.3 mm level from x -12.75 to -17.75" }
rear_boss_right = { value = [-18.0, -12.75, -25.0, -13.5, 0.0], source = "MicrasHardware model: block_R's rear screw boss round H4 (-15.5, -19.25)" }
body_left = { value = [-22.0, 8.0, 9.0, 13.5, 1.5], source = "MicrasHardware model: block_L's body inboard of its plate, 1.8 mm level" }
body_right = { value = [-22.0, 8.0, -13.5, -12.0, 1.5], source = "MicrasHardware model: block_R's body inboard of its plate, 1.8 mm level from y -12" }
tail_left = { value = [-22.0, -12.75, 13.5, 25.0, 1.5], source = "MicrasHardware model: block_L behind and beside its rear boss and over the notch's rear corner, 1.8 mm level" }
tail_right = { value = [-22.0, -12.75, -25.0, -13.5, 1.5], source = "MicrasHardware model: block_R behind and beside its rear boss, 1.8 mm level" }
