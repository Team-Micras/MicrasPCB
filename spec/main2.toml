left_motor_can = { value = [-17.0, -3.5, -13.1, 0.0, 3.7], source = "MicrasHardware model: the left motor's can past the centre line, 4.0 mm level; lengthened for the maxon DCX 10 L (catalogue p100 drawing: 25.2 mm can from the flange, 1.95 mm terminals, against the model's 20 + 2 mm): the can's rear moves from y -5.6 to -10.8 and its terminals reach -12.8, plus Layout.clearance 0.3 mm. MicrasHardware still models the 20 mm motor; the owner reshapes the chassis" }
magnet_right = { value = [-3.5, -0.75, -12.0, -9.0, 1.5], source = "MicrasHardware model: block_R and the right magnet cup beside the encoder slot, 1.8 mm level" }
