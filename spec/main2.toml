[encoder_boards]
# The encoder boards standing in their slots (spec/encoder.toml): 0.79 mm thick, 8.0 mm wide at the
# shoulder on this board's top, 9.6 mm from 7.5 mm up, parts on the chip face (outwards) from 2.5 mm
# up. Part-free, as [drive_blocks] zones, but for the slot footprints EC1/EC2 themselves.
left = { value = [-4.5, 4.5, 6.2, 8.6, 0.0], source = "spec/encoder.toml [outline] base_width 8.0 (taper to 9.6 from taper_start 7.46) with 0.5 mm a side; [pcb] thickness 0.79 at [encoder_slots] y 6.9, with 0.3 mm inboard and 1.3 mm outboard for its chip-face parts (boards/encoder layout R1-R3, C1: 0.4-0.6 mm off the face)" }
right = { value = [-4.5, 4.5, -8.6, -6.2, 0.0], source = "as left, mirrored (MicrasHardware layout.encoders: the right board turned 180 deg, chip outwards)" }

[drive_blocks]
# What MicrasHardware's drive blocks and motors take over the board, from its model (micras/drive.py,
# layout.py, params.py at 6b48d17): the lowest chassis part above each 0.5 mm cell of the board top,
# sectioned at 0.3-12 mm. Each zone is [x_min, x_max, y_min, y_max, max_part_height]; a part inside
# a zone stays at or below its height (0: part-free), which leaves MicrasHardware Layout.clearance
# (0.3 mm) under the chassis. The sides differ: the left motor sits low behind its axle
# (Layout.motor_angle_left = 180 deg) and its can reaches past the centre line, the right one high
# (112 deg). Outside the zones the chassis leaves 12 mm and more, up to the battery. The owner may
# reshape the blocks (2026-10-17): these zones are the current blocks'.
