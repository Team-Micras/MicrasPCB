# Placement of the Bluetooth module's schematic (micras-pcb sch; units of 1.27 mm, y down).
paper = "A5"
title = "Bluetooth module"

[[block]]
at = [0, -10]
frame = [
    [12, 20, 50, 46, "USB-C plug, to the main board's U2"],
    [63, 26, 89, 62, "HM-19 BLE module, its status LED and key pad"],
]
parts.USB1 = { at = [36, 46], mirror = "x" }
parts.R1 = [77, 58, 90]
parts.R2 = { at = [77, 60], rot = 90, fields = "bottom" }
parts.U1 = [108, 68]
parts.C1 = [99, 36, 180]
parts.C2 = [118, 36, 180]
parts.OP1 = [140, 46]
parts.R3 = { at = [132, 54], rot = 90, fields = "bottom" }
parts.D1 = { at = [144, 54], rot = 180, fields = "bottom" }
wires = [
    # GND and shell contacts, one ground symbol
    ["USB1.18", [22, 28], [22, 38], "USB1.1"],
    ["USB1.17", [22, 30]],
    ["USB1.16", [22, 32]],
    ["USB1.9", [22, 34]],
    ["USB1.8", [22, 36]],
    [[22, 28], [18, 28]],
    # SBU1 and SBU2: the main board's switched 3V3
    ["USB1.14", [22, 44], [22, 46], "USB1.6"],
    [[22, 44], [18, 44]],
    # the plug joins both D- and both D+ contacts
    ["USB1.13", [50, 56], [50, 58], "USB1.5"],
    [[50, 56], [52, 56]],
    ["USB1.12", [50, 60], [50, 62], "USB1.4"],
    [[50, 62], [52, 62]],
    # UART through R1 and R2
    ["R1.2", "U1.2"],
    ["R2.2", "U1.4"],
    # VCC and its capacitors
    ["U1.10", [94, 54], [94, 52]],
    ["U1.9", [94, 52], [94, 34], "C2.2"],
    [[94, 34], [90, 34]],
    ["U1.16", [124, 52], [124, 44], "OP1.1"],
    ["U1.15", "R3.1"],
    ["R3.2", "D1.2"],
]
taps = ["R1.2", "R2.2", "U1.16", "U1.15", "R3.2"]
stubs."R1.1" = { len = 0 }
stubs."R2.1" = { len = 0 }
