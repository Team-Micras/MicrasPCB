# Firmware changes the main2 board needs against the v1 firmware (boards/main/firmware.toml, from
# MicrasFirmware), on top of boards/main/firmware_changes.toml (C1 and M11 apply first and the
# changes below move their pins: the battery divider to PC5, PH0 to Switch_0, PA5 to the emitter
# DAC; m17, the pull-up on UART4_RX, carries over). tests/test_main2.py checks the board against
# firmware.toml with both files applied in order. Format:
# tools/micras_pcb/firmware.py. Sources: research/next-revision/README.md and the board's sheets.

[[change]]
id = "drive"
summary = "DRV8874 bridges in PH/EN mode (PMODE = GND, SLVSF66A Table 3): the timer PWM on EN, the direction on PH as a GPIO, replacing the L6205 IN1/IN2 forward/backward PWM pairs. EN = 0 is the low-side brake, so the bridge alternates drive and slow decay"
pins = { "PA8" = { signal = "S_TIM1_CH1", label = "Motor_Right_EN" }, "PB8" = { signal = "GPIO_Output", label = "Motor_Right_PH" }, "PC7" = { signal = "S_TIM8_CH2", label = "Motor_Left_EN" }, "PC6" = { signal = "GPIO_Output", label = "Motor_Left_PH" } }
behaviour = { motor_pwm = "100 kHz (the DRV8874's fPWM maximum, below the INA241's 125 kHz PWM rejection), centre-aligned, unipolar sign-magnitude; duty feed-forward scaled by the measured VBAT", motor_min_pulse = "the DRV8874 specifies no minimum output pulse; its edges take 150 ns each (SLVSF66A section 6.5), so EN pulses under 0.3 us (3 % duty at 100 kHz) do not reach full swing: round smaller non-zero duties to 0, or leave them to the current loop on the INA241 reading, never to the open-loop feed-forward (Drivers.zen)", motor_timers = "TIM1 and TIM8 centre-aligned (CMS = 01), PSC = 0, ARR = 1375 at the 275 MHz timer clock (research/next-revision/calculations/mcu/timer_plan.py), MOE set on both; TIM1 CR2 MMS = 001 (Enable: TRGO = CNT_EN) and MMS2 = 0010 (Update: TRGO2, the ADC trigger, current); TIM8 SMCR TS = 00000 (ITR0 = tim1_trgo, RM0468 Rev 3 Table 350) and SMS = 0101 (gated: TIM8 counts only while TIM1 counts, so both start and stop together on the one APB2 timer clock, a few clock cycles of resynchronisation apart), TIM8 CEN set before TIM1 CEN. The bridges run 180 degrees apart without a counter offset: TIM1_CH1 in PWM mode 1 (CCR1 = duty x ARR, the pulse centred on CNT = 0) and TIM8_CH2 in PWM mode 2 (CCR2 = ARR - duty x ARR, ARR + 1 for zero duty, the pulse centred on CNT = ARR), so at each TIM1 update one motor is mid-on and the other mid-off", motor_polarity = "PH high drives OUT1 high (DRV8874 SLVSF66A Table 3), so the current runs from the bridge through the shunt into connector pin 2 and back from pin 1 (Drivers.zen): on both bridges PH high reads as a positive INA241 current, whatever the harness. Which wheel each connector drives and which way it turns are the harness's: with the v1 robot's motors and cables, which main2 keeps (MicrasFirmware c987dc1 config/targets/v1/target.hpp, locomotion_config: on the main board the TIM1 bridge, the one on connector M2, drove the left wheel, and current into its pin 2 turned that wheel backward; the TIM3 bridge on M1 drove the right wheel forward with current into its pin 2; boards/main/Drivers.zen), main2's Motor_Right bridge (TIM1, IC8, M2) drives the left wheel backward with PH high and its Motor_Left bridge (TIM8, IC9, M1) the right wheel forward with PH high; the encoders keep the v1 slots, timers and sign (EC1 right on TIM2, EC2 left on TIM5)", wheel_sign_check = "no bench: the firmware learns each bridge's wheel and sign itself and stores them with the calibration (CalibrationRecord). Commissioning, robot on the floor: Motors_Enable, then per bridge in turn PH high at 10 % duty for 100 ms with the other bridge braking; the INA241 current must read positive (above +50 mA) or the bridge, shunt or amplifier is faulty and the drive stays off; the encoder that moves names the wheel on that bridge (a swapped harness swaps the mapping), and its count sign gives the wheel sign (forward, or reversed: then PH low is forward and the wheel-frame current is the negated INA241 reading). Every start: the first 20 ms of motion must move each encoder in the commanded direction with the current's sign matching, else stop and flag a sign fault; the stored mapping is re-learned only by the commissioning step" }

[[change]]
id = "sleep"
summary = "Motors_Enable (PA10) drives both DRV8874 nSLEEP inputs (R49 holds them asleep in reset): high wakes the bridges, which need up to 1 ms (tWAKE, SLVSF66A section 6.5) before the first PWM edge; PMODE and IMODE latch on that wake"
behaviour = { motors_enable = "set Motors_Enable at least 1 ms before driving EN; clear it to sleep both bridges (outputs Hi-Z)" }

[[change]]
id = "fault"
summary = "Motors_nFault on PB2 (EXTI2): both DRV8874 nFAULT outputs wire-ORed with a 10 kOhm pull-up. IMODE = GND (fixed off-time, automatic retry), so it falls only on a real fault (UVLO, OCP, thermal shutdown), never on an ITRIP chop"
pins = { "PB2" = { signal = "GPIO_EXTI2", label = "Motors_nFault", pull = "none" } }
behaviour = { motor_fault = "EXTI on the falling edge of Motors_nFault: stop the drive, report the fault; the bridges retry by themselves after 2 ms (OCP) or on cooling (TSD)" }

[[change]]
id = "current"
summary = "Motor current from the INA241A2 amplifiers: 20 V/V on 10 mOhm, 0.2 V/A, zero at VDDA / 2 (ratiometric), positive from the bridge into the motor; range about +7.1 / -8.0 A. Left on PB1 (ADC1/2 channel 5, a fast channel), right on PC1 (ADC1/2 channel 11, slow); the wall sensors they displace move to PA4 and PC0 (pinmap)"
behaviour = { current_sampling = "TIM1 TRGO2 = Update (CNT = 0 and CNT = ARR) triggers ADC1 + ADC2 in dual injected-simultaneous mode (optional JOVSE x4); tag each sample mid-on or mid-off by TIM1 DIR; no wall-sensor conversion overlapping the injected samples", adc_groups = "ADC_CCR DUAL = 00101 (injected simultaneous only, RM0468 Rev 3 section 28.4.32), ADC1 the master: ADC1 JSQR channel 5 (PB1), ADC2 JSQR channel 11 (PC1), JL = 0 on both with the same SMP (the mode's rule), JEXTSEL = 01000 (tim1_trgo2, Table 227) and JEXTEN = 01 (rising) on ADC1; the regular group on ADC1 only (Wall_Sensor_0..3 on channels 18 PA4, 4 PC4, 3 PA6, 10 PC0, and the battery on channel 8 PC5), which an injected trigger interrupts and resumes (28.4.32), ADC2 without regular conversions, ADC3 off: ADC1 and ADC2 in dual mode do not disturb each other, but a concurrent conversion on another instance can (ES0491 Rev 9 erratum 2.10.11); every channel's ADC_PCSEL bit set, which closes the pin's analog switch (section 28.4.12; HAL_ADC_ConfigChannel does it); JSQR rewritten without changing its trigger while the context queue is on (erratum 2.10.1)", dac_channel_1 = "PA4 carries Wall_Sensor_0 and DAC1_OUT1: DAC1 channel 1 stays disabled (EN1 = 0) with DAC_MCR MODE1 = 011 (channel 1 on on-chip peripherals only, off the PA4 pad, RM0468 Table 266), and MODE2 = 010 (normal mode, buffer off, to the PA5 pin), DAC_MCR written after one write to a DAC data register (ES0491 erratum 2.11.1). In STM32CubeMX: DAC OUT1 'only on chip analog peripherals' (HAL_DAC_ConfigChannel on channel 1 with the buffer off and the on-chip connection, never started) beside OUT2 'only external pin'; CubeMX 6.18.1 keeps PA4 as ADC1_INP18 with it", vdda_tracking = "the ADP7142 publishes no maximum output tempco, so the firmware measures VDDA (= VREF+) and rescales the wall, current and battery readings by it: VREFINT routed to ADC2 VINP[17] (SYSCFG_ADC2ALT ADC2_ROUT1 = 1, VREFEN in ADC3_CCR; RM0468 Rev 3 Table 223 and section 28.4.11), VDDA = 3.3 V x VREFINT_CAL / VREFINT_DATA (section 28.4.34) with VREFINT_CAL the 16-bit raw value at 0x1FF1E860-0x1FF1E861 taken at 30 C and VDDA = 3.3 V (DS13311 Rev 5 Table 22), scaled to the conversion's resolution; sampling at least 4.3 us (tS_vrefint, Table 21). That sample does not fit between the 5 us injected triggers, so about once a second the firmware masks ADC1's injected trigger (JEXTEN = 00) for one PWM period, skipping two current samples, while ADC2 converts VREFINT. The calibration itself is taken at 30 +- 5 C and VREF+ = 3.3 V +- 10 mV (VREFINT_CAL_ADDR comment, stm32h7xx_ll_adc.h): a fixed error of up to 0.3 % that each board's own calibration absorbs. Drift bound after it: VREFINT's average tempco is at most 70 ppm/C and its supply coefficient at most 1370 ppm/V (Table 21, by design), so VDDA is known within 0.21 % over 0-60 C from the 30 C calibration plus at most 0.0063 % for 3V3_D's 3.284-3.346 V (1370 ppm/V x 46 mV); the wall readings scale by VDDA, the battery by VDDA, the currents by VDDA around the measured VDDA / 2 zero", current_sampling_time = "PB1 and PC1 sample for at least adc.current_sampling_time_min_us (the next SMP step at or above it at the chosen fADC): the 4 pF sample capacitor (DS13311 Table 84) carries the previous channel's voltage, and since the wall sensors and the battery share ADC1/ADC2 with the currents, it dumps up to 13 mV (66 mA) onto C102/C105 1 nF; behind R78/R79 150 Ohm the INA241 restores it to under 1 mA from 0.64 us on in every corner of TI's model (research/next-revision/calculations/current_sense/ina241_riso_out.txt; tests/test_main2.py). A shorter sampling time needs a dummy conversion of the same channel first. The held value is the pin at the end of the sampling window, which trails the shunt current by the INA241 and R_iso C_f (0.35 us at 100 kHz, ina241_riso_out.txt section 1): a sample triggered at a PWM centre reads the ripple that much plus the trigger latency and the sampling time later, which the mean of the mid-on and mid-off samples weighted by D and 1 - D cancels (the ripple's slopes average to zero over a period) and a single centre does not", current_calibration = "offset and linearity calibration at boot, the zero with the bridge braking at each prepare(), a per-board gain in flash" }

adc = { current_sampling_time_min_us = 0.7 }

[[change]]
id = "battery"
summary = "Battery divider 10 kOhm / 2 kOhm on PC5 (ADC1/ADC2 channel 8, a slow channel, DS13311 Table 85; analog, no pull) for the 4S pack (2.90 V at 17.4 V): the firmware divides by 6.0, replacing C1's 4.704. PA5 becomes the emitter DAC (emitters), and PC5's Switch_0 moves to PH0 (switches)"
pins = { "PC5" = { signal = "ADCx_INP8", label = "Battery_Voltage", pull = "none" } }
battery = { channel = "pin", divider = 6.0 }

[[change]]
id = "switches"
summary = "The DIP switch on the STM32's right-facing pin rows, all GPIO inputs with the internal pull-up: Switch_0 on PH0 (replacing M11's USB_VBUS_Sense: the H7 has no VBUS divider, the ESP32 reports USB power over UART4, esp), Switch_1-3 on PH1, PC15 and PC14 (pinmap). The HSE and LSE stay off (no crystals)"
pins = { "PH0-OSC_IN" = { signal = "GPIO_Input", label = "Switch_0", pull = "up" }, "PH1-OSC_OUT" = { signal = "GPIO_Input", label = "Switch_1", pull = "up" }, "PC15-OSC32_OUT" = { signal = "GPIO_Input", label = "Switch_2", pull = "up" }, "PC14-OSC32_IN" = { signal = "GPIO_Input", label = "Switch_3", pull = "up" } }

[[change]]
id = "pinmap"
summary = "Layout pin swaps (owner, 2026-10-20): each line leaves the STM32 from the pin row facing its part, so none circles the chip. Switch_1-3 move to PH1, PC15, PC14 (switches), ESP_Flow to PB0, Motors_nFault to PB2 (fault), and Encoder_Right_CSn from PC14 to PB7 (GPIO output, as before). For the routing (owner, 2026-10-21): Current_Sensor_Left moves from PC0 to PB1 (current), Wall_Sensor_0 from PB1 to PA4 and Wall_Sensor_3 from PA4 to PC0. So that no line crosses the STM32's rear tip (owner, 2026-10-24): the wall selectors move from TIM4 (PB6-PB9) to TIM3 on PC9, PB0, PB4, PB5 (emitters), the left motor from TIM3 to TIM8_CH2 on PC7 with its PH on PC6 and the right motor's PH on PB8 (drive), LED_ARGB from PC6 (TIM8_CH1) to PB9 (TIM17_CH1, leds), ESP_Flow from PB0 to PA9 (esp), IMU_INT2 from PB4 to PB6 and IMU_INT1 from PB5 to PB10 (GPIO inputs, as before)"
pins = { "PB7" = { signal = "GPIO_Output", label = "Encoder_Right_CSn" }, "PA4" = { signal = "ADCx_INP18", label = "Wall_Sensor_0" }, "PB1" = { signal = "ADCx_INP5", label = "Current_Sensor_Left" }, "PC0" = { signal = "ADCx_INP10", label = "Wall_Sensor_3" }, "PB6" = { signal = "GPIO_Input", label = "IMU_INT2" }, "PB10" = { signal = "GPIO_Input", label = "IMU_INT1" } }

[[change]]
id = "fan"
summary = "STSPIN958 fan PWM on TIM12_CH2 (PB15) at 400 kHz (ARR 687) for a drone-class motor on 4S"
behaviour = { fan_pwm = "400 kHz; duty = V_cmd / VBAT, never below the 11.2 % floor of the 280 ns minimum pulse except 0; ramp the duty and let the REF limit (3.94 A) absorb the start-up; Fan_TOFF high means the limiter is active (stall flag)", fan_start = "start from rest at 50 kHz (ARR 5503) with the duty ramp and move to 400 kHz (ARR 687) once Fan_TOFF stops asserting: at 400 kHz the limiter's minimum on-time can hold a stalled low-resistance motor at 5-13 A, above the 7 A overcurrent shutdown, while at 50 kHz every stall case stays under it (Drivers.zen, L6; research calculations/fan/fan_choke_check.py); Fan_TOFF asserting without a break at 50 kHz means a jammed fan: clear Fan_Enable" }

[[change]]
id = "esp"
summary = "UART4 (PA11 RX, PA12 TX) is the link to the ESP32-S3 (its UART1) at up to 5 Mbaud; ESP_Flow (PA9) is the ESP's flow-control line toward the MCU (low: hold off). PA11/PA12 carry no USB: the USB-C port is the ESP32's. The ESP drives ESP_Flow from its GPIO13 and NRST (open drain) from its GPIO21: GPIO1-20 glitch for 60 us at the ESP's power-up (ESP32-S3 datasheet v2.2 Table 2-2), which on ESP_Flow only reads as hold off"
pins = { "PA9" = { signal = "GPIO_Input", label = "ESP_Flow", pull = "down" } }
behaviour = { uart4 = "UART4 at up to 5 Mbaud with DMA, bit 20 of DMA_SxCR set on its streams (ES0491 Rev 9 erratum 2.5.1: a UART stream can otherwise lock); ESP-to-MCU attention in band; the ESP's GPIO17 (U1TXD) glitches low for about 60 us at its power-up (ESP32-S3 datasheet v2.2 Table 2-2), so UART4 discards framing errors and partial frames until the ESP's first valid frame", dma_buffers = "every DMA1/DMA2 buffer (ADC, DAC, TIM17, UART4) in AXI SRAM or SRAM1/SRAM2, never DTCM, which DMA1/DMA2 cannot reach (RM0468 Rev 3 Table 2), and cleaned or invalidated around the D-cache or in a non-cacheable MPU region", usb_power = "the ESP32 senses VBUS on its own divider (ESP_VBUS_Sense, GPIO7) and reports USB power over UART4; the H7 has no VBUS input", usb_only = "with USB power reported by the ESP32 and no battery reading, keep the emitters, LEDs and motors off or dim (the USB budget is 500 mA)" }

[[change]]
id = "emitters"
summary = "The four IR emitters share one constant-current sink whose current DAC1 channel 2 sets on PA5 (Wall_Emitter_Set, output buffer off, 12-bit right-aligned): I = (1.005 x code / 4096 x VDDA x 20 / (RO + 220 kOhm) - 16.4 mV) / 1.2 Ohm, RO 10.3-16 kOhm (DS13311 Table 90): about 175 mA at code 3258, 223 mA at 4095, nothing below code 236. Each selector's gate is AC-coupled: a Wall_Sensor_PWM pin held high turns its emitter off within 7.5 ms. The selectors move from TIM4 (PB6-PB9) to TIM3 (pinmap)"
pins = { "PA5" = { signal = "DAC1_OUT2", label = "Wall_Emitter_Set", pull = "none" }, "PC9" = { signal = "S_TIM3_CH4", label = "Wall_Sensor_PWM_0" }, "PB0" = { signal = "S_TIM3_CH3", label = "Wall_Sensor_PWM_1" }, "PB4" = { signal = "S_TIM3_CH1", label = "Wall_Sensor_PWM_2" }, "PB5" = { signal = "S_TIM3_CH2", label = "Wall_Sensor_PWM_3" } }
behaviour = { wall_emitters = "time-multiplex the four Wall_Sensor_PWM channels (TIM3) so their on-times never overlap; read each receiver during its own emitter's pulse", emitter_dac = "DAC1 channel 2 in normal mode with the output buffer off (0 V to VREF+, DS13311 Table 90) holds the slot's code only while that slot's selector is on: it steps up at or after the selector's rising edge and to 0 at or before its falling edge, and stays 0 in the dark slot. A DAC leading or trailing its selector by 5 us starts the pulse at up to 275 mA, still settled before the scan (Sensors.zen)", emitter_dac_timing = "the DAC has no TIM3 trigger (RM0468 Rev 3 Table 264), so TIM4, which main2 frees, clocks it in lock with TIM3: TIM3 CR2 MMS = 001 (Enable); TIM4 SMCR TS = 00010 (ITR2 = tim3_trgo, Table 355) and SMS = 0101 (gated), PSC = 0, ARR = 13749 (one update per 50 us), CNT preset to ARR so its first update falls on TIM3's first tick, CR2 MMS = 010 (TRGO = update), CEN set before TIM3's; DAC_CR TEN2 = 1, TSEL2 = 0011 (dac_ch2_trg3 = tim4_trgo, Table 264), DMAEN2 = 1; a DMA stream on DMAMUX1 input 68 (dac_ch2_dma, Table 118) moves half-words from a circular 20-entry buffer (one 1 ms frame: c0, c0, c0, 0, c1, c1, c1, 0, c2, c2, c2, 0, c3, c3, c3, 0, 0, 0, 0, 0) into DAC_DHR12R2; each trigger moves DHR to DOR and then requests the next value (section 31.4.8), so DAC_DHR12R2 is preloaded with the frame's first entry and the circular buffer holds the frame rotated by one (from the second entry, ending with the first); a new code is a buffer write. DAC_DORx loads 3 dac_pclk after each trigger (section 31.4.7), so each step lags its grid edge by about 36 ns (timer_plan.py): end each selector pulse at least 0.1 us after its DAC zero step (TIM3 on-time 150 us + 1 us) so the DAC pulse sits inside the selector's. Freeze TIM3 and TIM4 together in debug (DBGMCU_APB1LFZ1 TIM3 and TIM4) or re-start both after a resume: the gate holds TIM4 to TIM3's CNT_EN, not to its frozen counter. TIM23 is the equivalent spare (TS = 00010, ITR2 = tim3_trgo; TSEL2 = 1110, tim23_trgo)", emitter_brightness = "a code per emitter, kept in flash with the sensor calibration (CalibrationRecord): 58 uA per code; the static gain errors (DAC, RO, divider, op-amp offset) are part of each sensor's calibration", emitter_duty = "each emitter lit 150 us per 1 ms frame (15 %), the shared sink 60 %: the 3.3 Ohm emitter resistors and Q9 are rated for that duty (Sensors.zen); a longer duty needs their numbers rechecked", emitter_slot_quiet = "no LED_ARGB frame and no SPI transfer (SPI_SCK, Encoder_Right_CSn, Encoder_Left_CSn, IMU_SPI_CSn) from a selector's rising edge to the end of its receiver scan (141 us later): Wall_Emitter_Set, the DAC set-point behind 10.3-16 kOhm with no capacitor, runs beside LED_ARGB and the encoder chip selects, and an edge there moves the emitter current during the scan; schedule them in the 50 us gaps and the dark slot" }

[[change]]
id = "leds"
summary = "Status LEDs WS2812C-2020-V6 (5 mA a channel) on 3V3_D (replacing the WS2815C-2020 on VBAT), same GRB protocol on LED_ARGB, which moves from PC6 (TIM8_CH1) to PB9 (TIM17_CH1, DMA on tim17_up; pinmap)"
pins = { "PB9" = { signal = "S_TIM17_CH1", label = "LED_ARGB" } }
behaviour = { led_timing = "T0H 220-380 ns, T1H 580 ns-1 us, T0L and T1L 580 ns-1 us (the WS2815C allowed 5 us), a bit T0H + T0L or T1H + T1L at least 1.25 us, reset low >= 280 us (Worldsemi WS2812C-2020-V6 datasheet V1.1 p4)", led_timer = "TIM17 (PSC = 0, 275 MHz) ARR = 355 (1.294 us a bit), CCR1 = 93 for a 0 (T0H 338 ns, T0L 956 ns) and 171 for a 1 (T1H 622 ns, T1L 673 ns), at least 42 ns inside every limit (research/next-revision/calculations/mcu/timer_plan.py); OC1 PWM mode 1 with OC1PE and ARPE, CC1E, and BDTR MOE = 1 (TIM17 has a break unit: without MOE its output stays idle, RM0468 Rev 3 section 46.6.14); a DMA stream on DMAMUX1 input 112 (tim17_up, RM0468 Table 118) writes the next CCR1 half-word at each update, 48 values for the two LEDs, then CCR1 = 0 holds the line low for the >= 280 us reset; the 62.1 us frame goes in the dark slot (emitter_slot_quiet), not in the 59 us after a lit slot's scan" }

[[change]]
id = "contest"
summary = "A contest mode with the ESP32's radio off. Every major contest forbids control or assistance into a running mouse and asks it to be autonomous or self-contained; none explicitly forbids transmit-only telemetry, but judges may read that wording strictly: All Japan (NTF rules 1-1, Attention 1 and 3-9, ntf.or.jp page_id 106/118/927/933), UKMARS and Minos (ukmars.org micromouse-classic and micromouse-half-size rules), IEEE Region 1 (2020 guideline C.1) and Region 2 (2018 section 2.1, 2020 section 3.2), APEC (1996 rules), Portugal (micromouse.utad.pt contest_rules: 'completely self-contained and must receive no outside assistance'); RoboCore Brazil (rules of 06/08/2024 section 3.1) and RoboChallenge allow a remote start only"
behaviour = { contest_mode = "selected on the mouse (DIP switch or button) before it is handed to the judges and held for the whole maze allocation: the ESP32's Wi-Fi and Bluetooth LE fully off (no TX, RX, advertising or beacons) and its Wi-Fi CMSIS-DAP server off; the run starts from an on-board button or sensor only; nothing received changes the run or the maze memory; telemetry is logged on board and offloaded over USB or the radio after the allocation; an LED_ARGB colour shows radio off so the judges can check it" }

[[change]]
id = "flash"
summary = "The MCU is flashed and debugged through the ESP32 over SWD with connect-under-reset (CMSIS-DAP over USB or Wi-Fi): OpenOCD (cmsis-dap) or probe-rs; ST-Link and STM32CubeProgrammer are not supported, and the system bootloader is not used"
behaviour = { flashing = "make flash moves to OpenOCD or probe-rs through the ESP32's CMSIS-DAP; the A/B images live in the ESP32's flash", probe_pins = "the ESP32's probe firmware drives SWDIO on GPIO11, SWCLK on GPIO12 and nRESET on GPIO21 (open drain), not on GPIO13, the nRESET default of wireless-esp8266-dap: GPIO13 carries ESP_Flow (Esp.zen)", probe_firmware = "base: espressif/esp-usb-bridge (Apache-2.0; CMSIS-DAP v2 + CDC + MSC on the S3's USB OTG, SWD build sdkconfig.swd.defaults, pins in menuconfig: its defaults clash with this board: TCK GPIO10 and TMS GPIO8 move to GPIO12 and GPIO11, the serial handler's TXD/RXD GPIO5/6 to UART1's GPIO17/18, its RESET (GPIO7, here ESP_VBUS_Sense, an input) and BOOT (GPIO4) to unused pins or off, and the LEDs off GPIO12-14); its PIN_nRESET_OUT is an empty stub (components/debug_probe/DAP/Config/DAP_config.h), so the probe adds nRESET as an open-drain output on GPIO21 for connect-under-reset; Wi-Fi CMSIS-DAP from bkuschak/cmsis_dap_tcp_esp32 (Apache-2.0, up to 200 kB/s SWD, about 6 MHz, OpenOCD master). The host runs the H7 flash algorithm (OpenOCD stm32h7x, probe-rs STM32H725), so the ESP needs no STM32 code" }

[[change]]
id = "debug"
summary = "A debug halt through the ESP32 probe stops the core but not the timers, and Motors_Enable (PA10) and Fan_Enable (PB14) keep their levels: R49 holds the bridges asleep only while the MCU is in reset"
behaviour = { debug_halt = "set the DBGMCU freeze bits of TIM1 and TIM8 (DBGMCU_APB2FZ1) and TIM12 (DBGMCU_APB1LFZ1, RM0468 DBGMCU) so no PWM runs on during a halt; a frozen TIM1 or TIM8 drives its outputs to their idle level (as if MOE were cleared, RM0468 advanced-control timer debug mode: Motor_Right_EN and Motor_Left_EN low, the brake), but a frozen TIM12 holds its output where it stopped, possibly high, so the probe's halt handler clears Motors_Enable (both bridges asleep, outputs Hi-Z) and Fan_Enable on every halt, and the firmware sets them again only after a resume and re-arm; TIM3's selectors need nothing (AC-coupled, off within 7.5 ms)" }

[[change]]
id = "imu"
summary = "The LSM6DSV (IC2) shares SPI_SCK and SPI_MOSI with the two encoder slots; while its CS is high it listens to them as I2C/I3C (SCL/SPC, SDA/SDI)"
behaviour = { imu_interface = "write I2C_I3C_disable = 1 in IF_CFG (03h) of the LSM6DSV at boot, before the first encoder transfer, so encoder traffic is never decoded as an I2C/I3C frame (LSM6DSV datasheet DS13476, I2C/I3C interface)" }
