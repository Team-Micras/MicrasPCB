# Nets supplied from off the board, the role a PWR_FLAG has in a hand-drawn KiCad schematic.
# `micras-pcb erc` accepts a power_pin_not_driven violation only on these nets; see
# tools/micras_pcb/checks.py `external_supplies`.

[external_supply]
BAT_P = "the 4S LiPo battery, pack + on J1 pin 1"
GND = "the battery, pack - on J1 pin 2 through the battery switch Q6; in USB use, the USB host (U2)"
GND_BAT = "the battery, pack - on J1 pin 2 (switched to GND by Q6)"
"+5V" = "the USB host, VBUS on U2 (A4B9, B4A9)"

# Nets supplied on the board through a passive part, which KiCad does not count as a power output.
[passive_supply]
VBAT = "BAT_P through the battery monitor's 2 mOhm shunt R59"
VSYS = "VBAT through the Schottky D14, or +5V through the P-MOSFET Q8"
"REGULATORS.LDO_IN" = "VSYS through the 22 Ohm input resistor R58 of the 3V3_A LDO"
VDDA = "3V3_A through the 0 Ohm link R67"
"3V3_D" = "the L6981C33 buck IC7 through its inductor L3 (IC7's VOUT/FB pin is the feedback input; on the main board the probe's ideal diode U5 was the power output on 3V3)"

# KiCad ERC warnings this board accepts, rule by rule (tools/micras_pcb/checks.py
# `accepted_warnings`): the same rule at error severity, and every other rule, still fails.
# Both come from how pcb 0.4.81 labels a net that crosses a module sheet
# (diodeinc/pcb#1520): it puts a global label with the net's name on the root and on the module
# sheet, next to the sheet pin and hierarchical label that carry the port, so KiCad sees each
# such net named twice. The netlist is unaffected. diodeinc/pcb#1522 generates sheet pins and
# hierarchical labels only; these warnings go away, and this table with them, when a pcb release
# includes it.
[accepted_warning]
same_local_global_label = "pcb 0.4.81 labels a net that crosses a module sheet with a global label on both sheets beside the local label and sheet pin (diodeinc/pcb#1520); goes away with a pcb release that includes diodeinc/pcb#1522"
multiple_net_names = "the global label (the net's name) and the hierarchical label (the module's port name) that pcb 0.4.81 puts on one net disagree where the port is an interface member (BAT_I2C.SDA, USB.D.P) (diodeinc/pcb#1520); goes away with a pcb release that includes diodeinc/pcb#1522"
