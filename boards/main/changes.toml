[[change]]
id = "C5"
review = "hw_debug/schematic_review.md C5, M3, section 4"
summary = "One regulated source on 3V3: the USB LDO U3 is removed (USB feeds the buck through U4), and the SWD probe's pin reaches 3V3 through the LM66100 ideal diode U5 (C64 1 uF at its input)"
