add_parts = { R50 = { "1" = "U2.A5", "2" = "new:PERIPHERALS.SBU_DET_A" }, D13 = { "1" = "new:PERIPHERALS.SBU_DET", "2" = "R50.2" }, C77 = { "1" = "net:GND", "2" = "D13.1" }, R51 = { "1" = "net:GND", "2" = "D13.1" }, R52 = { "1" = "net:3V3", "2" = "new:PERIPHERALS.SBU_VREF" }, R53 = { "1" = "net:GND", "2" = "R52.2" }, R54 = { "1" = "R52.2", "2" = "new:PERIPHERALS.SBU_EN_N" }, U7 = { "1" = "R54.2", "2" = "net:GND", "3" = "R52.2", "4" = "D13.1", "5" = "net:3V3" }, C78 = { "1" = "net:GND", "2" = "net:3V3" }, R55 = { "1" = "net:3V3", "2" = "R54.2" }, Q7 = { "1" = "R54.2", "2" = "net:3V3", "3" = "new:PERIPHERALS.SBU_SW" } }


