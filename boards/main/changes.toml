[[change]]
id = "M6"
review = "hw_debug/schematic_review.md M6"
summary = "The SBU supply of the Bluetooth module switched by Q7 (AO3401A) only while the module's signature is on CC1: the module ties CC to D+ (the UART4 TX, idle high), which lifts CC1 above any level a USB Type-C source makes across Rd (R2.0 Tables 4-35, 4-36); R50/D13/C77/R51 hold its peak, U7 (TLV7041) compares it with two thirds of 3V3 (R52/R53, hysteresis R54) and pulls Q7's gate (R55 to 3V3) low; C78 bypasses U7"
