[[change]]
id = "m7"
review = "hw_debug/schematic_review.md m7"
summary = "SWD connector P1 with NRST on pin 5, so a probe connects under reset: a JST SH 5-pin side-entry header (SM05B-SRSS-TB) on the board edge, its reinforcement pads on GND"
