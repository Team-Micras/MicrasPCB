add_parts = { U5 = { "1" = "net:SWD_VDD", "2" = "net:GND", "3" = "net:3V3", "5" = "net:GND", "6" = "net:3V3" }, C64 = { "1" = "net:GND", "2" = "net:SWD_VDD" } }

[[change]]
