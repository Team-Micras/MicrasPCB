add_parts = { H1 = {}, H2 = {}, H3 = {}, H4 = {} }

[[change]]
id = "M5"
review = "hw_debug/schematic_review.md M5, rework O3"
summary = "Battery switch slew: R43 100 kOhm from SW4 to Q6's gate and C58 47 nF from gate to drain hold the VBAT switch-on to 2.7 V/ms, below the STSPIN958's 0.5 V/us dVS/dt rating"
move = { "SW4.3" = "net:REGULATORS.BAT_SW_DRIVE" }
add_parts = { R43 = { "1" = "new:REGULATORS.BAT_SW_DRIVE", "2" = "Q6.1" }, C58 = { "1" = "net:GND", "2" = "Q6.1" } }

[[change]]
id = "C1-battery"
review = "hw_debug/schematic_review.md C1, rework R1"
summary = "Battery measurement after C1: R44 100 kOhm / R45 27 kOhm from VBAT with C59 100 nF into PA5 (ADC12_INP19), 2.68 V at 12.6 V"
add_parts = { R44 = { "1" = "net:VBAT", "2" = "IC1.24" }, R45 = { "1" = "net:GND", "2" = "IC1.24" }, C59 = { "1" = "net:GND", "2" = "IC1.24" } }

[[change]]
