# Firmware changes this board needs that MicrasFirmware does not have yet, against its v1 pin map
# and settings (firmware.toml, from MicrasFirmware). tests/test_main.py checks the board against
# firmware.toml with these applied in order, and flags an entry the firmware already has, so it is
# dropped when firmware.toml is regenerated. Format: tools/micras_pcb/firmware.py. Sources:
# research/next-revision/README.md and the board's sheets.

[[change]]
id = "drive"
summary = "DRV8874 bridges in PH/EN mode (PMODE = GND, SLVSF66A Table 3): the timer PWM on EN, the direction on PH as a GPIO, replacing the L6205 IN1/IN2 forward/backward PWM pairs. EN = 0 is the low-side brake, so the bridge alternates drive and slow decay"
pins = { "PA10" = { signal = "S_TIM1_CH3", label = "Motor_Right_EN" }, "PA9" = { signal = "GPIO_Output", label = "Motor_Left_PH" }, "PC6" = { signal = "S_TIM8_CH1", label = "Motor_Left_EN" }, "PB7" = { signal = "GPIO_Output", label = "Motor_Right_PH" } }
behaviour = { motor_pwm = "100 kHz (the DRV8874's fPWM maximum, below the INA241's 125 kHz PWM rejection), centre-aligned, unipolar sign-magnitude; duty feed-forward scaled by the measured VBAT", motor_min_pulse = "the DRV8874 specifies no minimum output pulse; its edges take 150 ns each (SLVSF66A section 6.5), so EN pulses under 0.3 us (3 % duty at 100 kHz) do not reach full swing: round smaller non-zero duties to 0, or leave them to the current loop on the INA241 reading, never to the open-loop feed-forward (Drivers.zen)", motor_timers = "TIM1 and TIM8 centre-aligned (CMS = 01), PSC = 0, ARR = 1375 at the 275 MHz timer clock (research/next-revision/calculations/mcu/timer_plan.py), MOE set on both; TIM1 CR2 MMS = 001 (Enable: TRGO = CNT_EN) and MMS2 = 0010 (Update: TRGO2, the ADC trigger, current); TIM8 SMCR TS = 00000 (ITR0 = tim1_trgo, RM0468 Rev 3 Table 350) and SMS = 0101 (gated: TIM8 counts only while TIM1 counts, so both start and stop together on the one APB2 timer clock, a few clock cycles of resynchronisation apart), TIM8 CEN set before TIM1 CEN. The bridges run 180 degrees apart without a counter offset: TIM1_CH3 in PWM mode 1 (CCR3 = duty x ARR, the pulse centred on CNT = 0) and TIM8_CH1 in PWM mode 2 (CCR1 = ARR - duty x ARR, ARR + 1 for zero duty, the pulse centred on CNT = ARR), so at each TIM1 update one motor is mid-on and the other mid-off", motor_polarity = "PH high drives OUT1 high (DRV8874 SLVSF66A Table 3), so the current runs from the bridge through the shunt into connector pin 2 and back from pin 1 (Drivers.zen): on both bridges PH high reads as a positive INA241 current, whatever the harness. Which wheel each connector drives and which way it turns are the harness's: with the v1 robot's motors and cables, which this board keeps (MicrasFirmware c987dc1 config/targets/v1/target.hpp, locomotion_config: on the v1 main board the TIM1 bridge, the one on connector M2, drove the left wheel, and current into its pin 2 turned that wheel backward; the TIM3 bridge on M1 drove the right wheel forward with current into its pin 2; MicrasPCB e34fb9a boards/main/Drivers.zen), this board's Motor_Right bridge (TIM1, IC8, M2) drives the left wheel backward with PH high and its Motor_Left bridge (TIM8, IC9, M1) the right wheel forward with PH high; the encoders keep the v1 slots, timers and sign (EC1 right on TIM2, EC2 left on TIM5)", wheel_sign_check = "no bench: the firmware learns each bridge's wheel and sign itself and stores them with the calibration (CalibrationRecord). Commissioning, robot on the floor: Motors_Enable, then per bridge in turn PH high at 10 % duty for 100 ms with the other bridge braking; the INA241 current must read positive (above +50 mA) or the bridge, shunt or amplifier is faulty and the drive stays off; the encoder that moves names the wheel on that bridge (a swapped harness swaps the mapping), and its count sign gives the wheel sign (forward, or reversed: then PH low is forward and the wheel-frame current is the negated INA241 reading). Every start: the first 20 ms of motion must move each encoder in the commanded direction with the current's sign matching, else stop and flag a sign fault; the stored mapping is re-learned only by the commissioning step" }

[[change]]
id = "sleep"
summary = "Motors_Enable (PD2, a GPIO output; pinmap) drives both DRV8874 nSLEEP inputs (R49 holds them asleep in reset): high wakes the bridges, which need up to 1 ms (tWAKE, SLVSF66A section 6.5) before the first PWM edge; PMODE and IMODE latch on that wake"
pins = { "PD2" = { signal = "GPIO_Output", label = "Motors_Enable" } }
behaviour = { motors_enable = "set Motors_Enable at least 1 ms before driving EN; clear it to sleep both bridges (outputs Hi-Z)" }

[[change]]
id = "fault"
summary = "Motors_nFault on PB6 (EXTI6, on the EXTI9_5 interrupt, which it shares with IMU_INT on EXTI7: the handler reads EXTI_PR1 bits 6 and 7 to tell them apart; RM0468 Rev 3 SYSCFG_EXTICR2 EXTI6 = 0001 for port B): both DRV8874 nFAULT outputs wire-ORed with a 10 kOhm pull-up. IMODE = GND (fixed off-time, automatic retry), so it falls only on a real fault (UVLO, OCP, thermal shutdown), never on an ITRIP chop"
pins = { "PB6" = { signal = "GPIO_EXTI6", label = "Motors_nFault", pull = "none" } }
behaviour = { motor_fault = "EXTI on the falling edge of Motors_nFault: stop the drive, report the fault; the bridges retry by themselves after 2 ms (OCP) or on cooling (TSD)", motor_stall = "a stalled wheel (drive commanded, the INA241 reading at the ITRIP chop, the encoder not moving) is cut within 5 s: a DRV8874 holding a 3.23 A stall (the top of the ITRIP band) from a 40 C board reaches about 146 C in 10 s, 14 K under its 160 C thermal shutdown (RthJB 11.1 C/W, SLVSF66A thermal information; a board thermal estimate), so 5 s keeps the margin; the bridge's own thermal shutdown is the last resort, not the stall handler" }

[[change]]
id = "current"
summary = "Motor current from the INA241A2 amplifiers: 20 V/V on 10 mOhm, 0.2 V/A, zero at VDDA / 2 (ratiometric), positive from the bridge into the motor; range +7.25 / -8.15 A at 3V3_A 3.3 V (the INA241's output swing, Sensors.zen). Left on PA6 (ADC1/2 channel 3, a fast channel), right on PC1 (ADC1/2 channel 11, slow); the wall sensors they displace move to PA4, PA3, PB1 and PC0 (pinmap)"
behaviour = { current_sampling = "TIM1 TRGO2 = Update (CNT = 0 and CNT = ARR) triggers ADC1 + ADC2 in dual injected-simultaneous mode (optional JOVSE x4); tag each sample mid-on or mid-off by TIM1 DIR; no wall-sensor conversion overlapping the injected samples", adc_groups = "ADC_CCR DUAL = 00101 (injected simultaneous only, RM0468 Rev 3 section 28.4.32), ADC1 the master: ADC1 JSQR channel 3 (PA6), ADC2 JSQR channel 11 (PC1), JL = 0 on both with the same SMP (the mode's rule), JEXTSEL = 01000 (tim1_trgo2, Table 227) and JEXTEN = 01 (rising) on ADC1; the regular group on ADC1 only (Wall_Sensor_0..3 on channels 18 PA4, 15 PA3, 5 PB1, 10 PC0, and the battery on channel 8 PC5), which an injected trigger interrupts and resumes (28.4.32), ADC2 without regular conversions, ADC3 off: ADC1 and ADC2 in dual mode do not disturb each other, but a concurrent conversion on another instance can (ES0491 Rev 9 erratum 2.10.11); every channel's ADC_PCSEL bit set, which closes the pin's analog switch (section 28.4.12; HAL_ADC_ConfigChannel does it); JSQR rewritten without changing its trigger while the context queue is on (erratum 2.10.1)", dac_channel_1 = "PA4 carries Wall_Sensor_0 and DAC1_OUT1: DAC1 channel 1 stays disabled (EN1 = 0) with DAC_MCR MODE1 = 011 (channel 1 on on-chip peripherals only, off the PA4 pad, RM0468 Table 266), and MODE2 = 010 (normal mode, buffer off, to the PA5 pin), DAC_MCR written after one write to a DAC data register (ES0491 erratum 2.11.1). In STM32CubeMX: DAC OUT1 'only on chip analog peripherals' (HAL_DAC_ConfigChannel on channel 1 with the buffer off and the on-chip connection, never started) beside OUT2 'only external pin'; CubeMX 6.18.1 keeps PA4 as ADC1_INP18 with it", vdda_tracking = "the ADP7142 publishes no maximum output tempco, so the firmware measures VDDA (= VREF+) and rescales the wall, current and battery readings by it: VREFINT routed to ADC2 VINP[17] (SYSCFG_ADC2ALT ADC2_ROUT1 = 1, VREFEN in ADC3_CCR; RM0468 Rev 3 Table 223 and section 28.4.11), VDDA = 3.3 V x VREFINT_CAL / VREFINT_DATA (section 28.4.34) with VREFINT_CAL the 16-bit raw value at 0x1FF1E860-0x1FF1E861 taken at 30 C and VDDA = 3.3 V (DS13311 Rev 5 Table 22), scaled to the conversion's resolution; sampling at least 4.3 us (tS_vrefint, Table 21). That sample does not fit between the 5 us injected triggers, so about once a second the firmware masks ADC1's injected trigger (JEXTEN = 00) for one PWM period, skipping two current samples, while ADC2 converts VREFINT. The calibration itself is taken at 30 +- 5 C and VREF+ = 3.3 V +- 10 mV (VREFINT_CAL_ADDR comment, stm32h7xx_ll_adc.h): a fixed error of up to 0.3 % that each board's own calibration absorbs. Drift bound after it: VREFINT's average tempco is at most 70 ppm/C and its supply coefficient at most 1370 ppm/V (Table 21, by design), so VDDA is known within 0.21 % over 0-60 C from the 30 C calibration plus at most 0.0063 % for 3V3_D's 3.284-3.346 V (1370 ppm/V x 46 mV); the wall readings scale by VDDA, the battery by VDDA, the currents by VDDA around the measured VDDA / 2 zero", current_sampling_time = "PA6 and PC1 sample for at least adc.current_sampling_time_min_us (the next SMP step at or above it at the chosen fADC): the 4 pF sample capacitor (DS13311 Table 84) carries the previous channel's voltage, and since the wall sensors and the battery share ADC1/ADC2 with the currents, it dumps up to 13 mV (66 mA) onto C102/C105 1 nF; behind R78/R79 150 Ohm the INA241 restores it to under 1 mA from 0.61 us on in every corner of TI's model (research/next-revision/calculations/current_sense/ina241_riso_out.txt; tests/test_main.py). A shorter sampling time needs a dummy conversion of the same channel first. The held value is the pin at the end of the sampling window, which trails the shunt current by the INA241 and R_iso C_f (0.35 us at 100 kHz, ina241_riso_out.txt section 1): a sample triggered at a PWM centre reads the ripple that much plus the trigger latency and the sampling time later, which the mean of the mid-on and mid-off samples weighted by D and 1 - D cancels (the ripple's slopes average to zero over a period) and a single centre does not", current_calibration = "offset and linearity calibration at boot, the zero with the bridge braking at each prepare(), a per-board gain in flash" }

adc = { current_sampling_time_min_us = 0.7 }

[[change]]
id = "battery"
summary = "Battery divider 20 kOhm / 2 kOhm on PC5 (ADC1/ADC2 channel 8, a slow channel, DS13311 Table 85; analog, no pull) for the 4S pack (1.58 V at 17.4 V, 2.20 V at D15's 24.2 V clamp, inside PC5's 4.0 V absolute maximum): the firmware divides by 11.0, where the v1 firmware reads the internal VBAT/4 channel. PA5 becomes the emitter DAC (emitters), and PC5's Switch_0 moves to PH0 (switches)"
pins = { "PC5" = { signal = "ADCx_INP8", label = "Battery_Voltage", pull = "none" } }
battery = { channel = "pin", divider = 11.0 }
behaviour = { battery_absent = "a battery reading below 6.0 V for 10 ms means no pack: the board runs on a programmer's 5 V pin (5V_IN on J2 pad 2 or SWD1 pad 5, Regulators.zen D17), or the pack is in with SW4 off; VBAT then floats on D14's leakage (and, with the pack in, Q6's) below the bridges' 4.3 V UVLO minimum: up to 3.42 V at 85 C on 5V_IN alone and about 3.9 V with the pack in and SW4 off (Regulators.zen VSYS; research calculations/power_tree/power_path_checks.py), a reading of a few volts that still means no pack; the firmware keeps Motors_Enable and Fan_Enable low, runs no motor or fan, lights no wall emitter and keeps the LEDs dim, and flags 'no pack' rather than an empty one. 6.0 V sits above that float and below the lowest a pack reads under load (3.0 V/cell at 6 A through 0.55 Ohm: about 8.7 V)", battery_low = "a pack reads lower under load (0.2-0.55 Ohm with leads, J1 and F1, at 5-6 A peaks: 1.3-3.3 V of sag, so a pack at 3.5 V/cell reads 10.7-12.7 V mid-run): at rest (motors and fan off) warn below 14.0 V (3.5 V/cell), refuse a new run below 13.2 V (3.3 V/cell) and sleep below 12.8 V held 5 s; during a run never act on one reading: stop only when the reading averaged over 1-2 s (or corrected by I x R_pack from the current sensors) stays below 12.0 V (3.0 V/cell, the cells' discharge cut-off) for more than 1 s" }

[[change]]
id = "switches"
summary = "The DIP switch on the STM32's right-facing pin rows, all GPIO inputs with the internal pull-up: Switch_0 on PH0 (the board has no USB), Switch_1-3 on PH1, PC15 and PC14 (pinmap). The HSE and LSE stay off (no crystals)"
pins = { "PH0-OSC_IN" = { signal = "GPIO_Input", label = "Switch_0", pull = "up" }, "PH1-OSC_OUT" = { signal = "GPIO_Input", label = "Switch_1", pull = "up" }, "PC15-OSC32_OUT" = { signal = "GPIO_Input", label = "Switch_2", pull = "up" }, "PC14-OSC32_IN" = { signal = "GPIO_Input", label = "Switch_3", pull = "up" } }

[[change]]
id = "pinmap"
summary = "The layout's pin map (main.zen): each line leaves the STM32 from the pin row facing its part, and the lines that pass the fan hole leave its rear faces in the order of their routes round it. Against the v1 map: Switch_1-3 on PH1, PC15 and PC14 (switches); Current_Sensor_Left on PA6 (current), Wall_Sensor_0 on PA4, Wall_Sensor_1 on PA3, Wall_Sensor_2 on PB1 and Wall_Sensor_3 on PC0, so no wall-sensor input sits beside the fan's 400 kHz PWM pin PA7; the wall selectors on TIM3 at PC9, PB0, PB4 and PB5 (emitters); the right motor on PA10 (TIM1_CH3) and PB7, the left on PC6 (TIM8_CH1) and PA9 (drive); Motors_Enable on PD2 (sleep) and Motors_nFault on PB6 (fault); Fan_TOFF on PB10 and Fan_Enable on PB12 (fan); ESP_Flow on PA11 (esp); IMU_INT on PC7 (imu); Button on PC4 (button); LED_ARGB on PA2 (TIM15_CH1, leds) and the buzzer on PB9 (TIM17_CH1, buzzer); the right encoder's A on PA15 and B on PB3 (encoder_right); and, as GPIO outputs, Encoder_Left_CSn on PA8, IMU_SPI_CSn on PA12, Encoder_Right_CSn on PB8 and LED_Blue on PB2"
pins = { "PB8" = { signal = "GPIO_Output", label = "Encoder_Right_CSn" }, "PA12" = { signal = "GPIO_Output", label = "IMU_SPI_CSn" }, "PA8" = { signal = "GPIO_Output", label = "Encoder_Left_CSn" }, "PB2" = { signal = "GPIO_Output", label = "LED_Blue" }, "PA4" = { signal = "ADCx_INP18", label = "Wall_Sensor_0" }, "PA6" = { signal = "ADCx_INP3", label = "Current_Sensor_Left" }, "PA3" = { signal = "ADCx_INP15", label = "Wall_Sensor_1" }, "PB1" = { signal = "ADCx_INP5", label = "Wall_Sensor_2" }, "PC0" = { signal = "ADCx_INP10", label = "Wall_Sensor_3" } }

[[change]]
id = "fan"
summary = "STSPIN958 fan PWM on TIM14_CH1 (PA7, AF9; PB15 goes to the sensor bus, sensor_bus) at 400 kHz (ARR 687) for a drone-class motor on 4S: TIM14, like TIM12 before it, runs from the APB1 timer clock (RM0468 Rev 3 RCC_APB1LENR TIM12EN and TIM14EN), 275 MHz, so PSC 0 and the ARR values stay; Fan_TOFF moves from PB13 to PB10 (a GPIO input, no pull, sampled in step with the PWM: fan_toff); Fan_Enable moves from PB14 (which the sensor bus takes) to PB12, driven open drain and read back as the driver's nFAULT"
pins = { "PB12" = { signal = "GPIO_Output", label = "Fan_Enable" }, "PA7" = { signal = "S_TIM14_CH1", label = "Fan_PWM" }, "PB10" = { signal = "GPIO_Input", label = "Fan_TOFF", pull = "none" } }
behaviour = { fan_pwm = "400 kHz; duty = V_cmd / VBAT, never below the 11.2 % floor of the 280 ns minimum pulse except 0, and never above 1 - 280 ns x fPWM (88.8 % at 400 kHz, 98.6 % at 50 kHz): with PWM2/PH low the STSPIN958 leaves a current-limit decay only when PWM1 goes low (DS14341 section 5.6.2.2), so every period needs a low pulse of at least the 280 ns minimum (Table 2); ramp the duty and let the REF limit (3.94 A) absorb the start-up", fan_toff = "Fan_TOFF is low while the limiter decays the current and high otherwise (DS14341 section 5.6.2: in PWM trimming TOFF is a digital output forced low during the decay; Figure 14: it falls when the current reaches the REF limit and rises at PWM1's next falling edge), so a low reading means the limiter cut that period's pulse. Sample it in step with the PWM, never by an asynchronous poll: TIM14 has no DMA request (RM0468 Rev 3 Table 118), so TIM24 (a 32-bit timer on the same 275 MHz APB1 timer clock, free on this board) runs with TIM14's ARR, started with it and its CNT preset for the start-up offset, its CCR1 kept at TIM14's CCR1 less about 14 ticks (50 ns), and its compare request (tim24_ch1_dma, DMAMUX1 input 132) moves GPIOB_IDR into a circular buffer once per fan period, just before PWM1 falls (DMA1 and DMA2 reach AHB4's GPIOB, RM0468 Table 2); the firmware counts the samples with the PB10 bit low", fan_start = "start from rest at 50 kHz (ARR 5503) with the duty ramp and move to 400 kHz (ARR 687) once Fan_TOFF stops going low (fan_toff): at 400 kHz the limiter's minimum on-time can hold a stalled low-resistance motor at 5-13 A mean, which the overcurrent protection need not stop (it trips per MOSFET at IOC 7-14 A, DS14341 section 5.7 and Table 5, 91.4 % of that at 17 V, Figure 20, and the parallel mode shares the current between two MOSFETs, so the device trips at about 12.8-28 A): the driver dissipates up to about 12 W, cycles through its thermal shutdown, and L6 runs far past its 20 % point; at 50 kHz every stall case up to 500 ns of blanking peaks at 4.8-5.7 A (Drivers.zen, L6; research calculations/fan/fan_choke_check.py, section 2); Fan_TOFF low without a break at 50 kHz means a jammed fan: clear Fan_Enable", fan_jam = "at 400 kHz, Fan_TOFF low in most fan periods (more than half the fan_toff samples) over 1-2 ms means a stalled or jammed fan held by the minimum on-time below the device's overcurrent trip (fan_start): within 2 ms drop to 50 kHz (ARR 5503) with the duty ramp, or drive Fan_Enable low, and restart only through fan_start", fan_stop = "stop the fan by ramping the duty down and then driving Fan_Enable low (EN = 0: output high-Z, DS14341 Table 11), so it coasts; never by holding Fan_PWM low with Fan_Enable released: PWM1 = 0 with EN = 1 turns the low side on (Table 11), a brake whose current runs backwards through R31, where the limiter's comparator (V1 = ACL x VLSS against REF, section 5.6) cannot see it, so nothing bounds it. That brake is also the state at an MCU reset (PWM1's internal pull-down, R27 pulling the released Fan_Enable high), accepted: a reset with the fan spinning brakes it once", fan_enable = "PB12 is an open-drain output (GPIO_MODE_OUTPUT_OD, no pull) on the STSPIN958's EN/nFAULT, which R27 39 kOhm pulls to 3V3_D with C30 10 nF (Drivers.zen): the firmware releases it to enable and drives it low to disable, and reads the pin: low while released is the driver's fault (the STSPIN958 pulls its EN/nFAULT pin low on a fault, Drivers.zen); after a release the pin rises with R27 x C30 = 0.39 ms, so the fault reading waits at least 2 ms", fan_fault_interrupt = "PB12 also runs as EXTI12 on the falling edge (the EXTI15_10 interrupt, which ESP_Flow's EXTI11 shares: the handler reads EXTI_PR1 for both lines), unmasked only while the firmware releases the pin: the STSPIN958 pulls EN/nFAULT low on a fault and releases it once the pin is below VIL(EN), at VFAULT (0.4 V typical, 0.6 V max), then R27 x C30 (0.39 ms) charges it to VIH(EN) 2.55 V before it retries, so the pin stays low about 0.5 ms (0.39 ms x ln((3.3 - 0.4) / (3.3 - 2.55)) = 0.53 ms; DS14341 section 5.7, Figure 15, Table 5) and a fault is caught without polling; mask EXTI12 before driving the pin low and clear its pending bit before unmasking it after a release (and the 2 ms wait above)" }

[[change]]
id = "esp"
summary = "The radio is an ESP32-C5-MINI-1-N4 (Esp.zen), its own firmware, not the MCU's: ESP_Flow (PA11, EXTI11, pull-down) is the C5's credit and attention line toward the MCU (link), driven from its GPIO24, and the C5 drives NRST open drain from its GPIO23. Both C5 pins are off with no pull at reset (ESP32-C5 TRM v1.1 Table 8.13-1) and no C5 pin has a documented power-up glitch, so PA11 reads low (no credit) until the C5's firmware drives it"
pins = { "PA11" = { signal = "GPIO_EXTI11", label = "ESP_Flow", pull = "down" } }
behaviour = { radio_firmware = "ESP-IDF v6.0.3 or later: the first release with the spi_slave_hd driver's SPI_SLAVE_HD_3WIRE_MODE (backported to v6.0.3: v6.0.2's driver/spi_slave_hd.h lacks it, v6.0.3's has it), which the link needs (link_protocol); two OTA application slots with rollback (esp_https_ota) in the module's 4 MB flash, with the probe, the link and telemetry in one image: each slot holds at most about 1.4 MB if a staged copy of the H7's image (up to 1 MB, the STM32H725RGV6's flash) is kept beside them, else about 1.9 MB (the partition table, NVS and OTA data take about 0.1 MB)", radio_recovery = "the flashing pads J2 (ESP-Prog Program interface order, 2x3 plated holes at 1.27 mm, the adapter's wires soldered once or a 2x3 header fitted): an ESP-Prog with its PROG PWR SEL jumper at 5 V, or any USB-serial adapter with 3.3 V logic on TX0/RX0 (GPIO11/GPIO12) and its 5 V pin (never its 3.3 V one) on pad 2, 5V_IN, which powers the board without the pack; hold GPIO28 (pad 6) low and pulse EN (pad 1) for the ROM's UART download mode (the ESP-Prog's DTR/RTS do it for esptool; with a plain adapter by hand, and esptool told not to reset), which no application can disable short of burning EFUSE_DIS_DOWNLOAD_MODE (never burned); then idf.py flash or esptool write_flash; the ROM and the application log on UART0 at 115200 baud", radio_clock = "the C5's RTC slow clock on its internal RC oscillator (CONFIG_RTC_CLK_SRC_INT_RC): GPIO0 and GPIO1 are the XTAL_32K pins and carry SWDIO and SWCLK, so no 32 kHz crystal or external clock is configured", radio_pulls = "the C5's internal pull on every open GPIO (Esp.zen); on GPIO10 per link mode: pull-down while it is the SPI clock input (PC10 drives it push-pull once SPI3 runs, AFCNTR = 1; the pull-down holds the mode-0 idle low while PC10 floats through an MCU reset or reflash), pull-up while it is U1RXD in the UART fallback (the line idles high before UART4 starts)", link_resync = "the C5 resynchronises the link after an MCU reset: a reset or a reflash of the MCU releases ESP_CSn (R97 pulls it high while PC11 floats) and cuts the transfer in flight. ESP_CSn rising ends a transaction, not a spi_slave_hd DMA buffer: the master ends a Wr_DMA buffer with WR_DONE (CMD7) and a Rd_DMA buffer with CMD8 (ESP-IDF, ESP SPI Slave HD (Half Duplex) Mode Protocol), so a cut transfer leaves the C5's buffer open and the C5 cannot rely on ESP_CSn to drop it. The MCU's first transactions after boot are therefore WR_DONE (CMD7) and CMD8, which close whatever buffer a cut left open, then CMD9, which the C5 takes (cb_cmd9) as the resync request: it discards the buffers those commands closed (every frame carries its length and a check, so a short or corrupt frame is dropped in any case), re-arms its buffers and answers before any data; the C5 likewise reports its own resets in the first frame", radio_band = "country set explicitly; 5 GHz only (esp_wifi_set_band_mode) on channels 36-48, the only DFS-free channels in every target country; the C5 as a station on the laptop's access point, or as a soft access point on those channels", dma_buffers = "every DMA1/DMA2 buffer (ADC, DAC, TIM15, SPI2, SPI3 or UART4) in AXI SRAM or SRAM1/SRAM2, never DTCM, which DMA1/DMA2 cannot reach (RM0468 Rev 3 Table 2), and cleaned or invalidated around the D-cache or in a non-cacheable MPU region" }
[[change]]
id = "link"
summary = "The link to the ESP32-C5 is SPI3 in half-duplex on three wires, the MCU the master: ESP_SCK on PC10 (SPI3_SCK, AF6), ESP_DATA on PC12 (SPI3_MOSI pad, AF6, the one data line, IOSWP = 0), ESP_CSn on PC11 (GPIO output, software chip select, idle high), and ESP_Flow on PA11 (esp) for the C5's credits; UART4 (PC10 TX, PC11 RX, AF8) is the fallback on the same pins. SPI3 leaves the IMU and encoders to SPI2 (sensor_bus) so the link leaves the STM32 on the rear-right row, toward the C5. The C5 is an spi_slave_hd slave (3-wire, DMA append mode) behind R95 22 Ohm at PC10, R96 220 Ohm and R88 100 Ohm at the C5, with R97 100 kOhm holding ESP_CSn high (Esp.zen)"
pins = { "PC10" = { signal = "SPI3_SCK", label = "ESP_SCK" }, "PC12" = { signal = "SPI3_MOSI", label = "ESP_DATA" }, "PC11" = { signal = "GPIO_Output", label = "ESP_CSn" } }
behaviour = { link_spi = "SPI3 master, SPI_CFG2 COMM = 11 (half-duplex) and IOSWP = 0, so the single data line is the MOSI pad PC12 (RM0468 Rev 3 sections 55.4.2 and 55.4.4, Figure 643; STM32CubeMX 6.18.1 sets this up as SPI_DIRECTION_1LINE on PC10/PC12), SSM = 1 with ESP_CSn a GPIO, SPI_CFG2 AFCNTR = 1 (HAL Init.MasterKeepIOState = SPI_MASTER_KEEP_IO_STATE_ENABLE: the pins keep their alternate function and level while SPE = 0, so SCK never floats between transfers), SPI mode 0 on both ends (CPOL = CPHA = 0; spi_slave_hd_slot_config_t mode = 0 on the C5), MSB first, 8-bit frames; the direction set with HDDIR in SPI_CR1 only while SPE = 0 (55.4.4); the clock from spi123_ker_ck (PLL3, 125 MHz in the CubeMX project, shared by SPI1-3) at a prescaler the C5's GPIO-matrix input timing allows: start SPI3 at /8 (15.6 MHz), and raise it only after a bit-error test on the board", link_dma = "SPI3 RX and TX on DMA1 or DMA2 streams through DMAMUX1 request inputs 61 (spi3_rx_dma) and 62 (spi3_tx_dma) (RM0468 Table 118), buffers per dma_buffers", link_errata = "ES0491 Rev 9 section 2.21: after each EOT wait at least one SCK period before setting CSTART, or disable and re-enable SPI3 (2.21.1, master transfer stall at a system clock much faster than SCK); keep CRCSIZE at its default 00111 with CRC off and TSIZE > 0 (2.21.4, last received data corrupted); keep TXP and EOT interrupts disabled while SPE = 0 (2.21.3); wait for the last SCK edge after EOT before disabling SPI3 (2.21.5, truncated last clock)", link_protocol = "the C5 runs ESP-IDF's spi_slave_hd driver with SPI_SLAVE_HD_3WIRE_MODE (one bidirectional data line, MOSI = its SPID signal, ESP-IDF spi_slave_hd.h) and SPI_SLAVE_HD_APPEND_MODE (DMA descriptors appended while it runs): the MCU writes with the WRDMA command (Wr_DMA) and ends each written buffer with WR_DONE (CMD7), and reads with RDDMA (Rd_DMA) and ends each read buffer with CMD8 (ESP-IDF, ESP SPI Slave HD (Half Duplex) Mode Protocol: ESP_CSn rising ends a transaction, not a DMA buffer), its commands in 1-bit mode as 3-wire needs; ESP_CSn low frames each transaction; the C5 raises ESP_Flow (EXTI11 on PA11, rising; the EXTI15_10 interrupt, which Fan_Enable's EXTI12 shares: the handler reads EXTI_PR1 for both lines) when it has a receive buffer queued (a credit) or data to send, and the MCU starts a transaction only on a credit, so neither side overruns the other; the MCU transmits the command and address phases (HDDIR transmit), then turns its pin to receive (SPE = 0, HDDIR = 0) for the dummy and data phases of a read, so the C5 drives the line only after the MCU has released it and the two drivers never overlap; after a read the MCU releases ESP_CSn before it sets HDDIR = 1 (transmit) again, so the C5 has stopped driving first: with AFCNTR = 1 the MCU drives the pin as soon as HDDIR selects transmit, even while SPE = 0 (RM0468 Rev 3 section 55.4.9 step 2e, section 55.11.4 SPI_CFG2 AFCNTR); each half-duplex turn-around leaves both drivers off for at least one SCK period (R96 220 Ohm holds the current to 15.4 mA if they overlap, under DS13311 Table 11's 20 mA per pin; RM0468 Figure 643 note 3)", link_uart_fallback = "with no board change the link can run as UART4 instead: PC10 UART4_TX (AF8) into the C5's U1RXD on GPIO10, the C5's U1TXD on GPIO9 into PC11 UART4_RX (AF8; R97 holds it idle high, no internal pull needed) through R88; up to 5 Mbaud with DMA (UART4 DMAMUX1 inputs 63/64, RM0468 Table 118), bit 20 of DMA_SxCR set on its streams (ES0491 Rev 9 erratum 2.5.1); ESP_Flow keeps its credit role; STM32CubeMX 6.18.1 generates this set-up on these pins" }

[[change]]
id = "emitters"
summary = "The four IR emitters share one constant-current sink whose current DAC1 channel 2 sets on PA5 (Wall_Emitter_Set, output buffer off, 12-bit right-aligned): I = (1.005 x code / 4096 x VDDA x 20 / (RO + 220 kOhm) - 16.4 mV) / 1.2 Ohm, RO 10.3-16 kOhm (DS13311 Table 90): about 175 mA at code 3258, 223 mA at 4095, nothing below code 236. Each selector's gate is AC-coupled: a Wall_Sensor_PWM pin held high turns its emitter off within 7.5 ms. The selectors move from TIM4 (PB6-PB9) to TIM3 (pinmap)"
pins = { "PA5" = { signal = "DAC1_OUT2", label = "Wall_Emitter_Set", pull = "none" }, "PC9" = { signal = "S_TIM3_CH4", label = "Wall_Sensor_PWM_0" }, "PB0" = { signal = "S_TIM3_CH3", label = "Wall_Sensor_PWM_1" }, "PB4" = { signal = "S_TIM3_CH1", label = "Wall_Sensor_PWM_3" }, "PB5" = { signal = "S_TIM3_CH2", label = "Wall_Sensor_PWM_2" } }
behaviour = { wall_emitters = "time-multiplex the four Wall_Sensor_PWM channels (TIM3) so their on-times never overlap; read each receiver during its own emitter's pulse", emitter_dac = "DAC1 channel 2 in normal mode with the output buffer off (0 V to VREF+, DS13311 Table 90) holds the slot's code only while that slot's selector is on: it steps up at or after the selector's rising edge and to 0 at or before its falling edge, and stays 0 in the dark slot. A DAC leading or trailing its selector by 5 us starts the pulse at up to 275 mA, still settled before the scan (Sensors.zen)", emitter_dac_timing = "the DAC has no TIM3 trigger (RM0468 Rev 3 Table 264), so TIM4, which this board leaves free, clocks it in lock with TIM3: TIM3 CR2 MMS = 001 (Enable); TIM4 SMCR TS = 00010 (ITR2 = tim3_trgo, Table 355) and SMS = 0101 (gated), PSC = 0, ARR = 13749 (one update per 50 us), CNT preset to ARR so its first update falls on TIM3's first tick, CR2 MMS = 010 (TRGO = update), CEN set before TIM3's; DAC_CR TEN2 = 1, TSEL2 = 0011 (dac_ch2_trg3 = tim4_trgo, Table 264), DMAEN2 = 1; a DMA stream on DMAMUX1 input 68 (dac_ch2_dma, Table 118) moves half-words from a circular 20-entry buffer (one 1 ms frame: c0, c0, c0, 0, c1, c1, c1, 0, c2, c2, c2, 0, c3, c3, c3, 0, 0, 0, 0, 0) into DAC_DHR12R2; each trigger moves DHR to DOR and then requests the next value (section 31.4.8), so DAC_DHR12R2 is preloaded with the frame's first entry and the circular buffer holds the frame rotated by one (from the second entry, ending with the first); a new code is a buffer write. DAC_DORx loads 3 dac_pclk after each trigger (section 31.4.7), so each step lags its grid edge by about 36 ns (timer_plan.py): end each selector pulse at least 0.1 us after its DAC zero step (TIM3 on-time 150 us + 1 us) so the DAC pulse sits inside the selector's. Freeze TIM3 and TIM4 together in debug (DBGMCU_APB1LFZ1 TIM3 and TIM4) or re-start both after a resume: the gate holds TIM4 to TIM3's CNT_EN, not to its frozen counter. TIM23 is the equivalent spare (TS = 00010, ITR2 = tim3_trgo; TSEL2 = 1110, tim23_trgo)", emitter_brightness = "a code per emitter, kept in flash with the sensor calibration (CalibrationRecord): 58 uA per code; the static gain errors (DAC, RO, divider, op-amp offset) are part of each sensor's calibration", emitter_duty = "each emitter lit 150 us per 1 ms frame (15 %), the shared sink 60 %: the 3.3 Ohm emitter resistors and Q9 are rated for that duty (Sensors.zen); a longer duty needs their numbers rechecked", emitter_slot_quiet = "no LED_ARGB frame and no SPI transfer (SPI_SCK, Encoder_Right_CSn, Encoder_Left_CSn, IMU_SPI_CSn) from a selector's rising edge to the end of its receiver scan (141 us later): Wall_Emitter_Set, the DAC set-point behind 10.3-16 kOhm with no capacitor, runs beside LED_ARGB and the encoder chip selects, and an edge there moves the emitter current during the scan; schedule them in the 50 us gaps and the dark slot. The Buzzer (TIM17_CH1 on PB9) is silent through each receiver scan too (CCR1 = 0 from the selector's rising edge to the scan's end, or no sound at all while the wall sensors run): its line runs near the wall-sensor and current lines, and its edges at random phase would land on the 1 kOhm receiver nodes" }

[[change]]
id = "leds"
summary = "Status LEDs WS2812C-2427-V6 (5 mA a channel) on 3V3_D (replacing the WS2815C-2020 on VBAT), same GRB protocol on LED_ARGB, which moves from PC6 (TIM8_CH1) to PA2 (TIM15_CH1, AF4, DMA on tim15_up; pinmap). The single LED on PB2 (D4) is blue: its label LED_Red becomes LED_Blue (pinmap), and the firmware renames its pin and LED object to match"
pins = { "PA2" = { signal = "S_TIM15_CH1", label = "LED_ARGB" } }
behaviour = { led_timing = "T0H 220-380 ns, T1H 580 ns-1 us, T0L and T1L 580 ns-1 us (the WS2815C allowed 5 us), a bit T0H + T0L or T1H + T1L at least 1.25 us, reset low >= 280 us (Worldsemi WS2812C-2427-V6 datasheet V1.0 p4)", led_timer = "TIM15 (PSC = 0, 275 MHz, the APB2 timer clock) ARR = 355 (1.294 us a bit), CCR1 = 93 for a 0 (T0H 338 ns, T0L 956 ns) and 171 for a 1 (T1H 622 ns, T1L 673 ns), at least 42 ns inside every limit (research/next-revision/calculations/mcu/timer_plan.py); OC1 PWM mode 1 with OC1PE and ARPE, CC1E, and BDTR MOE = 1 (TIM15 has a break unit: without MOE its output stays idle, RM0468 Rev 3 section 46.5.16); a DMA stream on DMAMUX1 input 106 (tim15_up, RM0468 Table 118) writes the next CCR1 half-word at each update, 48 values for the two LEDs, then CCR1 = 0 holds the line low for the >= 280 us reset; the 62.1 us frame goes in the dark slot (emitter_slot_quiet), not in the 59 us after a lit slot's scan" }

[[change]]
id = "buzzer"
summary = "The buzzer (Q1's gate through R1, Peripherals.zen) moves from PA2 (TIM15_CH1, which LED_ARGB takes, leds) to PB9 (TIM17_CH1, AF1; pinmap). TIM17, like TIM15, is a 16-bit timer on the APB2 timer clock (RM0468 Rev 3 RCC_APB2ENR TIM15EN and TIM17EN), so the buzzer keeps its prescaler, periods and duty; TIM17 has one channel, which the buzzer needs"
pins = { "PB9" = { signal = "S_TIM17_CH1", label = "Buzzer" } }
behaviour = { buzzer_timer = "TIM17 CH1 in PWM mode 1 with the v1 buzzer's PSC, ARR and duty (micras-lib Buzzer on the TIM17 handle instead of TIM15's), BDTR MOE = 1 (TIM17 has a break unit, RM0468 Rev 3 section 46.6.14; HAL_TIM_PWM_Start sets it)" }

[[change]]
id = "contest"
summary = "A contest mode with the ESP32's radio off. Every major contest forbids control or assistance into a running mouse and asks it to be autonomous or self-contained; none explicitly forbids transmit-only telemetry, but judges may read that wording strictly: All Japan (NTF rules 1-1, Attention 1 and 3-9, ntf.or.jp page_id 106/118/927/933), UKMARS and Minos (ukmars.org micromouse-classic and micromouse-half-size rules), IEEE Region 1 (2020 guideline C.1) and Region 2 (2018 section 2.1, 2020 section 3.2), APEC (1996 rules), Portugal (micromouse.utad.pt contest_rules: 'completely self-contained and must receive no outside assistance'); RoboCore Brazil (rules of 06/08/2024 section 3.1) and RoboChallenge allow a remote start only"
behaviour = { contest_mode = "selected on the mouse (DIP switch or button) before it is handed to the judges and held for the whole maze allocation: the ESP32's Wi-Fi and Bluetooth LE fully off (no TX, RX, advertising or beacons) and its Wi-Fi probe server off, the C5 itself running for the link and the time base (timebase); the run starts from an on-board button or sensor only; nothing received changes the run or the maze memory; telemetry is logged on board and offloaded over the radio (or the J2 pads' UART) after the allocation; an LED_ARGB colour shows radio off so the judges can check it" }

[[change]]
id = "timebase"
summary = "No crystal on the MCU (PH0/PH1 carry Switch_0/Switch_1, switches): the H7 runs on its HSI, 64 MHz within +-1 % over TJ -20 to 105 C (DS13311 Rev 5 Table 40), and the firmware integrates the gyro over its own ticks (loop_time), so the yaw scale inherits up to 1 %. The time reference is the ESP32-C5's 48 MHz crystal, held to +-10 ppm (Espressif's ESP32-C5 hardware design guidelines), measured over the link"
behaviour = { timebase = "the H7 starts a link frame on fixed counts of its loop timer (the ESP_CSn falling edge on PC11 every N ticks); the C5 timestamps those edges against its crystal (its GPIO9, the CS input, also as a GPIO interrupt, with esp_timer) and returns the measured H7 tick period in its next frames; the H7 scales loop_time by it, or trims HSITRIM (RCC_HSICFGR) toward 64 MHz, and keeps the last value through link gaps; over 1 s of edges with 2 us of timestamp jitter the ratio is good to about 10 ppm, the crystal's own tolerance, against the HSI's 1 %. The C5 therefore stays powered and running in contest mode with its radio off (contest): the link is the measurement, no radio is needed" }

[[change]]
id = "sensor_bus"
summary = "The IMU and encoder bus (SPI_SCK, SPI_MISO, SPI_MOSI) moves from SPI3 (PC10-PC12, which the ESP32-C5 link takes, link) to SPI2 on the STM32's rear-left row: SPI_SCK on PB13, SPI_MISO on PB14, SPI_MOSI on PB15 (SPI2 AF5, DS13311 Rev 5 Table 9). SPI2 runs the v1 bus set-up (master, full duplex, 8-bit, /16 of spi123_ker_ck, which SPI1-3 share) but for its clock mode (sensor_bus_mode)"
pins = { "PB13" = { signal = "SPI2_SCK" }, "PB14" = { signal = "SPI2_MISO" }, "PB15" = { signal = "SPI2_MOSI" } }
behaviour = { sensor_bus_mode = "the AS5047U takes SPI mode 1 only (CPOL = 0, CPHA = 1: it samples MOSI on SCK's falling edge; AS5047U datasheet v1-00 p16, SPI Interface, Figure 18) and the LSM6DSV mode 0 or mode 3 (DS13476 Rev 5, SPI timing), so no one mode serves both: the bus driver sets CPOL and CPHA in SPI_CFG2 per device while SPE = 0 and every chip select is high, mode 1 for the encoders and mode 3 for the IMU (the v1 set-up's CPOL = 1, CPHA = 1 runs the encoders outside their datasheet), with SPI_CFG2 AFCNTR = 1 (HAL Init.MasterKeepIOState = SPI_MASTER_KEEP_IO_STATE_ENABLE) so SCK holds the idle level of the mode between transfers instead of floating", sensor_bus_dma = "SPI2 RX and TX on DMA1 or DMA2 streams through DMAMUX1 request inputs 39 (spi2_rx_dma) and 40 (spi2_tx_dma) instead of SPI3's 61 and 62 (RM0468 Rev 3 Table 118), buffers per dma_buffers; the bus driver's handle, IRQ (SPI2_IRQn) and DMA streams follow the instance" }

[[change]]
id = "button"
summary = "The user button (SW2, Button) moves from PA7 (which the fan PWM takes, fan) to PC4, a GPIO input with its pull-up as before (Peripherals.zen), beside PA7 in the wall sensors' place (pinmap); PA11 leaves UART4_RX, whose fallback is on PC11 (link), and carries ESP_Flow (esp)"
pins = { "PC4" = { signal = "GPIO_Input", label = "Button", pull = "up" } }
behaviour = { button_input = "Button reads PC4 (active low, internal pull-up, C20 100 nF debounce); if the firmware takes it as an interrupt it is EXTI4, on the EXTI4 interrupt alone" }

[[change]]
id = "flash"
summary = "The MCU is flashed and debugged through the ESP32-C5 over SWD with connect-under-reset, over Wi-Fi: a CMSIS-DAP-over-TCP probe (OpenOCD's cmsis-dap tcp back end, OpenOCD master) or a Black Magic Probe GDB server; ST-Link on the bare SWD1 pads is the fallback, and the system bootloader is not used"
behaviour = { flashing = "make flash moves to OpenOCD (cmsis-dap, tcp back end) or GDB on the Black Magic server through the ESP32-C5; the host runs the H7 flash algorithm (OpenOCD stm32h7x, Black Magic's STM32H7 target), so the C5 needs no STM32 code; the C5 may stage the next H7 image in its flash (radio_firmware)", probe_pins = "the C5's probe firmware drives SWDIO on GPIO0, SWCLK on GPIO1 (through R86 22 Ohm) and nRESET on GPIO23 as an open-drain output, never push-pull: its output level is set to 1 (released) before the pin is switched to an open-drain output, so it never drives NRST before the probe asks, and a reset pulse holds it low well beyond NRST's 350 ns minimum (DS13311 Table 61) (Esp.zen); the probes take their pins from a runtime setting (Black Magic's web page, cmsis_dap_tcp_esp32's GPIO number assignments), whose defaults clash with this board and must be set to these", probe_reset = "NRST rises slowly after the probe releases it: C21 100 nF against the MCU's 30-50 kOhm internal pull-up (DS13311 Rev 5 Table 61) takes 3.6-6 ms to reach the input high level (1.2 RC), so after a reset pulse the probe waits at least 10 ms, or reads GPIO23 back high, before it talks to the core; with OpenOCD: reset_config srst_only srst_nogate connect_assert_srst and adapter srst delay 10", swd1_fallback = "an ST-Link on the bare SWD1 pads shares SWDIO, SWCLK and NRST with the C5's GPIO0, GPIO1 (through R86) and GPIO23: before using it, hold the C5 in reset with EN low (J2 pad 1 joined to J2 pad 4, GND), which leaves its pins high-impedance; and the C5's probe firmware releases GPIO0, GPIO1 and GPIO23 (inputs, NRST's open drain off) whenever no debug session is open, so the two probes never drive the lines together", probe_firmware = "Black Magic Probe for the ESP32-C5 (BareMetalTestLab/blackmagic-esp32-c5: GDB on TCP 2345, RTT on 2346, the target UART on 2347, web OTA; its repository declares no licence), or bkuschak/cmsis_dap_tcp_esp32 (Apache-2.0; SWD up to about 6 MHz and 200 kB/s on the S3, C3 and C6) ported to the C5: its pin code uses ESP-IDF's portable GPIO layer, a port nobody has done yet. Either runs beside the link and telemetry in the C5's application" }
[[change]]
id = "debug"
summary = "A debug halt through the ESP32-C5 probe stops the core but not the timers, and Motors_Enable (PD2) and Fan_Enable (PB12) keep their levels: R49 holds the bridges asleep only while the MCU is in reset"
behaviour = { debug_halt = "set the DBGMCU freeze bits of TIM1 and TIM8 (DBGMCU_APB2FZ1) and TIM14 (DBGMCU_APB1LFZ1 bit 8, RM0468 Rev 3 DBGMCU) so no PWM runs on during a halt; a frozen TIM1 or TIM8 drives its outputs to their idle level (as if MOE were cleared, RM0468 advanced-control timer debug mode: Motor_Right_EN and Motor_Left_EN low, the brake), but a frozen TIM14 holds its output where it stopped, possibly high, so the probe's halt handler clears Motors_Enable (both bridges asleep, outputs Hi-Z) and drives Fan_Enable (PB12, open drain) low on every halt (two memory writes through the debug port: GPIOD_BSRR for Motors_Enable, then GPIOB_BSRR for Fan_Enable), and the firmware sets them again only after a resume and re-arm; TIM3's selectors need nothing (AC-coupled, off within 7.5 ms)" }

[[change]]
id = "imu"
summary = "The LSM6DSV (IC2) shares SPI_SCK and SPI_MOSI with the two encoder slots; while its CS is high it listens to them as I2C/I3C (SCL/SPC, SDA/SDI). Its INT1 (pin 4) alone drives IMU_INT on PC7 (EXTI7), push-pull and active high at its defaults; INT2 (pin 9) is unconnected"
pins = { "PC7" = { signal = "GPIO_EXTI7", label = "IMU_INT", pull = "none" } }
behaviour = { imu_gyro_range = "gyroscope full scale +-2000 dps (FS_G in CTRL6, 15h; 70 mdps/LSB), where the v1 firmware sets +-4000 dps (config/targets/v1/target.hpp): DS13476 Rev 5 Table 3 specifies the gyroscope's sensitivity, its tolerance and its noise only up to +-2000 dps (its notes), and the robot's yaw-rate cap of 12 rad/s (688 dps) leaves 2.9x headroom under it; a reading at the full scale is a crash, not a turn", imu_interface = "the boot write to IF_CFG (03h) of the LSM6DSV, before the first encoder transfer, sets I2C_I3C_disable, so encoder traffic is never decoded as an I2C/I3C frame; PP_OD and H_LACTIVE stay 0 (push-pull, active high, DS13476 Rev 5 Tables 28-29)", imu_interrupt = "every interrupt the firmware uses goes to INT1: through INT1_CTRL (0Dh) and MD1_CFG (5Eh), and those only INT2 offers (INT2_DRDY_G_EIS and INT2_EMB_FUNC_ENDOP in INT2_CTRL 0Eh, INT2_TIMESTAMP in MD2_CFG 5Fh, INT2_DRDY_TEMP in CTRL4) through CTRL4 (13h) INT2_on_INT1 = 1 (Table 58: ORed onto INT1, not fed to INT2); nothing is routed to INT2; IMU_INT on PC7 as EXTI7 on the rising edge, no pull (INT1 drives it, low by default, Table 22), on the EXTI9_5 interrupt, which Motors_nFault's EXTI6 (PB6, fault) shares: the handler reads EXTI_PR1 bits 6 and 7 to tell them apart, then the LSM6DSV's status registers (ALL_INT_SRC 1Dh, STATUS_REG 1Eh) to tell the sources apart" }

[[change]]
id = "io_speed"
summary = "The fast buses keep slow output edges: SPI2 (PB13-PB15, the IMU and encoder bus) and SPI3's driven pins (PC10 ESP_SCK, PC12 ESP_DATA) at GPIO speed medium (GPIOx_OSPEEDR 01: 80 MHz maximum and 4.2 ns edges at 30 pF, DS13311 Rev 5 Table 58, HSLV off), or low (00: 12 MHz, 13.3 ns) where a bus's clock stays at or under 12 MHz, not high or very high, so their edges couple less into the wall-sensor and current lines that run beside them (sensor_bus, link)"
behaviour = { io_speed = "PB13, PB14, PB15, PC10 and PC12 at GPIO_SPEED_FREQ_MEDIUM (OSPEEDR 01), or GPIO_SPEED_FREQ_LOW when the bus clock is 12 MHz or less", io_speed_pwm = "every free-running timer output at GPIO_SPEED_FREQ_LOW (OSPEEDR 00, 13.3 ns edges at 30 pF, DS13311 Rev 5 Table 58): Fan_PWM PA7 (TIM14_CH1, 400 kHz), Motor_Right_EN PA10 (TIM1_CH3) and Motor_Left_EN PC6 (TIM8_CH1, 100 kHz), LED_ARGB PA2 (TIM15_CH1, 1.29 us bits), the buzzer PB9 (TIM17_CH1) and the wall selectors PC9, PB0, PB5 and PB4 (TIM3_CH4, CH3, CH2, CH1): none needs a faster edge, and a slower one couples less into the wall-sensor and current lines beside them" }

[[change]]
id = "encoder_right"
summary = "The right encoder's A and B change TIM2 channels (layout: the A line leaves on F.Cu next to the rear tip, the B line on B.Cu past the rear-right row, pinmap): Encoder_Right_ABI_A on PA15 (TIM2_CH1, AF1) and Encoder_Right_ABI_B on PB3 (TIM2_CH2, AF1), where the v1 map has B on CH1 and A on CH2 (DS13311 Rev 5 Table 9; STM32CubeMX MCU database STM32H725RGVx). In encoder mode TI1 and TI2 trade places, so TIM2 counts the other way for the same wheel turn"
pins = { "PA15" = { signal = "S_TIM2_CH1_ETR", label = "Encoder_Right_ABI_A", pull = "up" }, "PB3" = { signal = "S_TIM2_CH2", label = "Encoder_Right_ABI_B", pull = "up" } }
behaviour = { encoder_right_direction = "TIM2 encoder mode (SMS = 011) with CC1P set (RM0468 Rev 3 TIMx_CCER: TI1 inverted), so the right wheel's count keeps the v1 sign with A on CH1 and B on CH2; or keep the polarity and negate the right encoder's reading in the driver" }

[[change]]
id = "encoder_filter"
summary = "The encoder timers TIM2 and TIM5 (the AS5047U ABI channels on EC1 and EC2) filter their inputs digitally, which the v1 set-up leaves off (cube/micras_v1.ioc: no ICxF): IC1F and IC2F in TIMx_CCMR1 at fCK_INT with N = 8 (0011: fSAMPLING = fCK_INT, N = 8, RM0468 Rev 3 TIMx_CCMR1 input capture mode), 29 ns at the 275 MHz APB1 timer clock (fan), well under an ABI edge's spacing, against the PWM and bus edges the lines pass"
behaviour = { encoder_filter = "TIM2 and TIM5 in encoder mode with IC1F = IC2F = 0011 (fCK_INT, N = 8)" }
