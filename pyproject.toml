[project]
name = "micras-pcb"
version = "0.1.0"
description = "Checks, generators and fab outputs for the Micras PCBs (Zener + KiCad 10)"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
micras-pcb = "micras_pcb.cli:main"

[dependency-groups]
dev = ["pytest", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tools/micras_pcb"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
