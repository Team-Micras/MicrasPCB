[project]
name = "micras-pcb"
version = "0.1.0"
description = "Checks, generators and fab outputs for the Micras PCBs (Zener + KiCad 10)"
requires-python = ">=3.14"
dependencies = []

[project.scripts]
micras-pcb = "micras_pcb.cli:main"

[dependency-groups]
dev = ["pytest>=9.1", "ruff>=0.17"]

[build-system]
requires = ["uv_build>=0.12,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = "tools"
module-name = "micras_pcb"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# E501 is left to the formatter.
select = ["E", "F", "W", "I", "UP", "B", "SIM", "PTH", "RUF"]
ignore = ["E501"]
